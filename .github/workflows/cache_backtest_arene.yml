name: Cache backtest arene

# Riempie i buchi di cache che impediscono al backtest arene di valutare
# una formazione: bastano 5 carte su 5 conosciute, quindi con il 10% di
# giocatori mancanti si perde quasi meta' dell'archivio.
#
# Dato pubblico (game log + dettaglio granulare), ma autenticato si va a
# 60 query/min invece di 20. Circa 70 query per giocatore.

on:
  workflow_dispatch:
    inputs:
      blocco:
        description: "Giocatori per blocco (si committa dopo ognuno)"
        required: false
        default: "20"
      blocchi:
        description: "Quanti blocchi al massimo"
        required: false
        default: "8"
      pausa:
        description: "Secondi fra query (1.2 autenticato, 3.2 anonimo)"
        required: false
        default: "1.2"

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi

      - name: Scarica a blocchi, salvando dopo ognuno
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          BLOCCO="${{ github.event.inputs.blocco }}"
          QUANTI="${{ github.event.inputs.blocchi }}"
          # Un blocco alla volta, con commit subito dopo: se il job muore o
          # viene annullato si perde al massimo un blocco, non tutto il lavoro.
          # (Prima il commit era solo alla fine, e un 403 sui permessi aveva
          # gia' fatto buttare quaranta minuti di scaricamento.)
          for i in $(seq 1 "$QUANTI"); do
            echo "=== blocco $i/$QUANTI (${BLOCCO} giocatori) ==="
            python scarica_cache_backtest.py --max "$BLOCCO"               --pausa "${{ github.event.inputs.pausa }}" || true
            git add -f dati_globali/backtest_arene_cache
            if git diff --cached --quiet; then
              echo "niente di nuovo: finito."
              break
            fi
            git commit -m "Backtest arene: cache giocatori mancanti (blocco $i)"
            for t in 1 2 3 4 5; do
              git pull --no-edit --no-rebase origin main || true
              if git push origin main; then break; fi
              echo "push fallito ($t/5)"; sleep 10
            done
          done

      - name: Cache anche come artifact (rete di sicurezza)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-arene-cache
          path: dati_globali/backtest_arene_cache
          # actions/upload-artifact@v4 esclude di default tutto cio' che
          # comincia per '.', e le cache condivise vivono in cartelle
          # nascoste (.game_log_cache, .cache): senza questa riga
          # l'artifact le perde in silenzio. Vedi il commento esteso in
          # formazione_giornata.yml (misurato il 12/08/2026).
          include-hidden-files: true
          if-no-files-found: warn

      - name: Rilancia il backtest col campione allargato
        if: always()
        run: python backtest_arene.py
