name: Cache backtest arene

# Riempie i buchi di cache che impediscono al backtest arene di valutare
# una formazione: bastano 5 carte su 5 conosciute, quindi con il 10% di
# giocatori mancanti si perde quasi meta' dell'archivio.
#
# Dato pubblico (game log + dettaglio granulare), ma autenticato si va a
# 60 query/min invece di 20. Circa 70 query per giocatore.

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Quanti giocatori al massimo (0 = tutti)"
        required: false
        default: "0"
      pausa:
        description: "Secondi fra query (1.2 autenticato, 3.2 anonimo)"
        required: false
        default: "1.2"

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi

      - name: Scarica lo storico dei giocatori mancanti
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scarica_cache_backtest.py \
            --max "${{ github.event.inputs.max }}" \
            --pausa "${{ github.event.inputs.pausa }}"

      - name: Salva la cache
        if: always()
        run: |
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f dati_globali/backtest_arene_cache
          git diff --cached --quiet && exit 0
          git commit -m "Backtest arene: cache giocatori mancanti"
          until git pull --no-edit --no-rebase origin main && git push origin main; do
            echo "push fallito, retry..."
            sleep 5
          done

      - name: Rilancia il backtest col campione allargato
        if: always()
        run: python backtest_arene.py
