        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { pattern: predict-austria-gk-*, path: formazione_austria/output/austria_gk_all, merge-multiple: true }
