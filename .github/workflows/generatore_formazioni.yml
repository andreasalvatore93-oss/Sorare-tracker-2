name: Generatore Formazioni

# Terza pipeline, AGGIUNTIVA rispetto a "Formazione Completa MLS" e
# "Formazione Completa K League" (che restano invariate, usabili da sole).
# Riusa gli stessi script discover/predict/consiglio di entrambi i tool,
# SENZA modificarli: stessi path di output/cache, quindi la cache
# incrementale gia' presente viene riusata cosi' com'e' (nessuna nuova
# query storica per giocatori gia' noti). L'unica cosa nuova e' il job
# finale, che applica il filtro qualita' e fonde tutto in fino a 8 tipi di
# lineup (vedi generatore_formazioni/build_formazione_globale.py).

on:
  workflow_dispatch:
    inputs:
      in_season:
        description: >
          Quante lineup In Season generare per lega. Formato: lega:quantità separate da virgola.
          Leghe valide oggi: mls, kleague. Lega omessa o a 0 = nessuna lineup per quella lega.
          Esempi: "mls:4,kleague:1" = 4 In Season MLS + 1 In Season K League.
          "mls:2" = solo 2 In Season MLS, K League a 0. Vuoto = nessuna In Season generata.
        required: false
        default: 'mls:0,kleague:0'
      arena_dedicata:
        description: >
          Quante Arene DEDICATE (cap L10 fisso 260, solo carte della lega scelta) per lega.
          Formato: lega:quantità separate da virgola. Leghe valide: mls, kleague, belgio,
          olanda (Eredivisie), turchia, portogallo, spagna, germania, francia (Ligue 1),
          croazia, scozia. Lega omessa o a 0 = nessuna lineup per quella lega.
          Esempi: "mls:1,belgio:1,olanda:2" = 1 Arena MLS + 1 Belgio + 2 Eredivisie.
          Vuoto = nessuna Arena dedicata generata.
        required: false
        default: ''
      arena_allstars_260:
        description: 'Numero di Arena All Stars con cap L10 fisso a 260 (pool misto TUTTI i campionati, 0 per disattivare)'
        required: false
        default: '0'
      arena_allstars_220:
        description: 'Numero di Arena All Stars con cap L10 fisso a 220 (pool misto, 0 per disattivare)'
        required: false
        default: '0'
      arena_allstars_uncapped:
        description: 'Numero di Arena All Stars SENZA cap L10 (pool misto, 0 per disattivare)'
        required: false
        default: '0'
      allstars:
        description: 'Numero di formazioni All Stars (7 carte, pool misto, cap 370 soft, 0 per disattivare)'
        required: false
        default: '0'
      starter_odds_min:
        description: 'Soglia minima starter-odds (0-1) per includere un giocatore, es. 0.60. Dato mancante = tenuto per sicurezza.'
        required: false
        default: '0.60'
      min_quality_score:
        description: 'Soglia minima L5/L10/L40 (tutti e tre) per entrare nel pool. Sotto soglia = carta scartata, nessun job predict sprecato.'
        required: false
        default: '35.0'

permissions:
  contents: write

concurrency:
  group: generatore-formazioni
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # DISCOVERY -- script ESISTENTI e INVARIATI dei due tool dedicati, stessi
  # path di output (formazione_mls/output/..., formazione_kleague/output/...).
  # ------------------------------------------------------------------
  discover_mls_gk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      player_slugs: ${{ steps.run_discovery.outputs.player_slugs }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - id: run_discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          MIN_STARTER_ODDS: ${{ github.event.inputs.starter_odds_min }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_mls/discovery/mls_gk_discovery.py
      - if: always()
        run: |
          git config user.name "generatore-formazioni-bot"
          git config user.email "generatore-formazioni-bot@users.noreply.github.com"
          git add formazione_mls/output/mls_gk_discovery/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generatore Formazioni: discovery MLS GK"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then exit 1; fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  discover_mls_def:
