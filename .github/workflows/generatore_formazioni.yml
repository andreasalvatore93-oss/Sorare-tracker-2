  merge_mls_gk:
    needs: [discover_mls_gk, predict_mls_gk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { pattern: predict-mls-gk-*, path: formazione_mls/output/mls_gk_all, merge-multiple: true }
        continue-on-error: true
      - run: python formazione_mls/consiglio/build_consiglio_gk.py
      - run: |
          git config user.name "generatore-formazioni-bot"
          git config user.email "generatore-formazioni-bot@users.noreply.github.com"
          git add formazione_mls/output/mls_gk_all/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generatore Formazioni: predict+consiglio MLS GK"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then exit 1; fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

