name: Best Five

# Trova la miglior formazione POSSIBILE per UNA lega scegliendo tra TUTTE le
# carte disponibili (pool globale, non solo posseduti), con backup per ruolo.
# Script separato e READ-ONLY rispetto alla pipeline di produzione
# (formazione_giornata.yml) -- vedi best_five.py e docs/HANDOFF_BEST_FIVE.md.
#
# 3 job, STESSO schema discovery/predict/consiglio della pipeline di
# produzione (parallelizzazione a matrice, non piu' un unico job sequenziale
# -- richiesta esplicita dell'utente dopo il primo run reale, 20 minuti per
# 45 giocatori contro i ~5 minuti della pipeline principale):
#   1) prefiltro: qualita' (gia' fatta in discovery) + starterOdds >= soglia,
#      poi shard dei sopravvissuti in <= 20 gruppi (bin_round_robin).
#   2) predict: matrice sui gruppi (max-parallel 20, stesso tetto reale
#      dell'account usato da formazione_giornata.yml), un subprocess
#      TARGET_SLUG per giocatore dentro ogni gruppo. Riusa pipeline_artifacts.py
#      (stage/apply) per passare i risultati tra job via artifact invece che
#      via commit+push, stesso motivo/fix di velocita' gia' documentato li'.
#   3) report: applica tutti gli artifact, costruisce il ranking finale
#      (nessuna chiamata API), salva su main, notifica Telegram col link
#      all'HTML.

on:
  workflow_dispatch:
    inputs:
      lega:
        description: 'Lega (es. kleague)'
        required: false
        default: 'kleague'
      roles:
        description: 'Ruoli da rigenerare, separati da virgola (vuoto = tutti e 4)'
        required: false
        default: 'gk,def,mid,fwd'
      backups:
        description: 'Numero di backup per ruolo'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  prefiltro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gruppi: ${{ steps.matrice.outputs.gruppi }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - id: matrice
        name: Qualita' (gia' in discovery) + starterOdds, poi shard
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          ARGS="${{ github.event.inputs.lega || 'kleague' }} --matrice"
          if [ -n "${{ github.event.inputs.roles }}" ]; then
            ARGS="$ARGS --roles ${{ github.event.inputs.roles }}"
          fi
          # NON reindirizzare tutto lo stdout su $GITHUB_OUTPUT (bug reale,
          # run 30560234622): best_five.py stampa anche i log ("[gk] Pool
          # globale...") su stdout, che con >> finivano TUTTI dentro
          # GITHUB_OUTPUT insieme alla riga "gruppi=..." -- formato non
          # valido, il file deve contenere SOLO righe "chiave=valore". Lo
          # script scrive gia' la riga "gruppi=..." direttamente nel file
          # (vedi cmd_matrice, os.environ['GITHUB_OUTPUT']), qui basta
          # lasciarlo girare normalmente.
          python best_five.py $ARGS

  predict:
    needs: prefiltro
    if: needs.prefiltro.outputs.gruppi != '' && needs.prefiltro.outputs.gruppi != '[]'
    name: predict ${{ matrix.gruppo.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        gruppo: ${{ fromJson(needs.prefiltro.outputs.gruppi) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - name: Predict shard
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          PYTHONUNBUFFERED: "1"
        run: python best_five.py "${{ github.event.inputs.lega || 'kleague' }}" --predict-shard "${{ matrix.gruppo.g }}"
      - if: always()
        run: python pipeline_artifacts.py stage _artifact_stage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bf-pred-${{ strategy.job-index }}
          path: _artifact_stage
          retention-days: 1

  report:
    needs: [prefiltro, predict]
    if: needs.prefiltro.outputs.gruppi != '' && needs.prefiltro.outputs.gruppi != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # NECESSARIO anche qui (bug reale, run 30560983351): best_five.py
      # importa curl_cffi/requests a livello di modulo (per la query
      # starterOdds), quindi fallisce all'IMPORT anche nello step "Costruisci
      # report" che non fa nessuna chiamata di rete -- e best_five_telegram_
      # notify.py importa requests direttamente, stesso problema.
      - run: pip install requests curl_cffi
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: bf-pred-*
      - run: python pipeline_artifacts.py apply _artifacts
      - name: Costruisci report (nessuna chiamata API, solo parsing)
        run: |
          set -u
          ARGS="${{ github.event.inputs.lega || 'kleague' }} --backups ${{ github.event.inputs.backups || '2' }}"
          if [ -n "${{ github.event.inputs.roles }}" ]; then
            ARGS="$ARGS --roles ${{ github.event.inputs.roles }}"
          fi
          python best_five.py $ARGS
      - name: Salva risultati
        if: always()
        run: |
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A formazione_*/output/*_gk_all formazione_*/output/*_def_all formazione_*/output/*_mid_all formazione_*/output/*_fwd_all formazione_*/output/best_five 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Best Five: risultati run $(date -u '+%Y-%m-%d %H:%M UTC')"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 5 ]; then
              echo "Impossibile salvare dopo 5 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
      # Notifica DOPO il salvataggio (non "always()": un link a un HTML mai
      # pushato sarebbe rotto) -- stesso schema di formazione_telegram_notify.py.
      # Stesso canale Telegram gia' usato da formazione_giornata/bot_profit/
      # manager_bundle_scan (secrets.BUNDLE_TELEGRAM_TOKEN/_CHAT_ID -> env
      # TELEGRAM_TOKEN/TELEGRAM_CHAT_ID) -- NON i secrets.TELEGRAM_TOKEN/
      # _CHAT_ID semplici, quelli sono il canale separato del tracker prezzi
      # (check.yml).
      - name: Notifica Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.BUNDLE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BUNDLE_TELEGRAM_CHAT_ID }}
          GIT_REF: main
          LEGA: ${{ github.event.inputs.lega || 'kleague' }}
        run: python best_five_telegram_notify.py
