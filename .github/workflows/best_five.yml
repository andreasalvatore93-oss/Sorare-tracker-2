name: Best Five

# Trova la miglior formazione POSSIBILE per UNA lega scegliendo tra TUTTE le
# carte disponibili (pool globale, non solo posseduti), con backup per ruolo.
# Script separato e READ-ONLY rispetto alla pipeline di produzione
# (formazione_giornata.yml) -- vedi best_five.py e docs/HANDOFF_BEST_FIVE.md.
#
# 5 job, STESSO schema discovery/predict/consiglio della pipeline di
# produzione (parallelizzazione a matrice, non piu' un unico job sequenziale
# -- richiesta esplicita dell'utente dopo il primo run reale, 20 minuti per
# 45 giocatori contro i ~5 minuti della pipeline principale):
#   1) pool_shard: qualita' (gia' fatta in discovery) sharda il pool in <= 20
#      gruppi, SENZA controllare le starterOdds -- solo la lista dei candidati.
#   2) prefiltro: matrice sui gruppi (max-parallel 20), controlla le
#      starterOdds >= soglia SOLO per il proprio shard. NUOVO (30/07): prima
#      era un job unico sequenziale, ~5-6 minuti su K League e OLTRE i 15
#      minuti di timeout su MLS (pool piu' grande) -- era il vero collo di
#      bottiglia, non il predict.
#   3) prefiltro_merge: unisce i sopravvissuti di tutti gli shard, poi li
#      risharda in <= 20 gruppi per il predict (bin_round_robin).
#   4) predict: matrice sui gruppi (max-parallel 20, stesso tetto reale
#      dell'account usato da formazione_giornata.yml), un subprocess
#      TARGET_SLUG per giocatore dentro ogni gruppo. Riusa pipeline_artifacts.py
#      (stage/apply) per passare i risultati tra job via artifact invece che
#      via commit+push, stesso motivo/fix di velocita' gia' documentato li'.
#   5) report: applica tutti gli artifact, costruisce il ranking finale
#      (nessuna chiamata API), salva su main, notifica Telegram col link
#      all'HTML.

# workflow_call (31/07, backlog "Contender"): permette a un altro workflow
# (best_five_contender.yml) di richiamare QUESTO stesso file una volta per
# lega, in un job a matrice, invece di duplicarne la logica. Stessi identici
# input di workflow_dispatch (necessario ripeterli qui: le due sezioni non
# condividono la definizione).
on:
  workflow_dispatch:
    inputs:
      lega:
        description: 'Lega (es. kleague)'
        required: false
        default: 'kleague'
      roles:
        description: 'Ruoli da rigenerare, separati da virgola (vuoto = tutti e 4)'
        required: false
        default: 'gk,def,mid,fwd'
      backups:
        description: 'Numero di backup per ruolo'
        required: false
        default: '2'
      starter_odds:
        description: 'Soglia starterOdds prefiltro (0-1), stesso significato di starter_odds_min in formazione_giornata.yml'
        required: false
        default: '0.70'
      top_k_qualita:
        description: 'Cap per qualita PRIMA delle starterOdds (top-K per ruolo secondo media L5/L10/L40). 0 = disattivato (pool intero)'
        required: false
        default: '40'
  workflow_call:
    inputs:
      lega:
        type: string
        required: false
        default: 'kleague'
      roles:
        type: string
        required: false
        default: 'gk,def,mid,fwd'
      backups:
        type: string
        required: false
        default: '2'
      starter_odds:
        type: string
        required: false
        default: '0.70'
      top_k_qualita:
        type: string
        required: false
        default: '40'

permissions:
  contents: write

jobs:
  pool_shard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gruppi_pool: ${{ steps.matrice.outputs.gruppi_pool }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # NECESSARIO (bug reale, run 30583862116): best_five.py importa
      # curl_cffi/requests a livello di modulo, fallisce all'IMPORT anche
      # qui che non fa nessuna chiamata di rete (solo shard del pool).
      - run: pip install requests curl_cffi
      - id: matrice
        name: Shard del pool (gia' filtrato per qualita' in discovery)
        env:
          BEST_FIVE_TOP_K_QUALITA: ${{ inputs.top_k_qualita || '40' }}
        run: |
          set -u
          ARGS="${{ inputs.lega || 'kleague' }} --matrice-pool"
          if [ -n "${{ inputs.roles }}" ]; then
            ARGS="$ARGS --roles ${{ inputs.roles }}"
          fi
          python best_five.py $ARGS

  prefiltro:
    needs: pool_shard
    if: needs.pool_shard.outputs.gruppi_pool != '' && needs.pool_shard.outputs.gruppi_pool != '[]'
    name: prefiltro ${{ matrix.gruppo.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        gruppo: ${{ fromJson(needs.pool_shard.outputs.gruppi_pool) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - name: starterOdds sul proprio shard
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          BEST_FIVE_MIN_STARTER_ODDS: ${{ inputs.starter_odds || '0.70' }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p _prefiltro_stage
          python best_five.py "${{ inputs.lega || 'kleague' }}" \
            --prefiltra-shard "${{ matrix.gruppo.g }}" --out _prefiltro_stage/survivors.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bf-surv-${{ strategy.job-index }}
          path: _prefiltro_stage
          retention-days: 1

  prefiltro_merge:
    needs: prefiltro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gruppi: ${{ steps.merge.outputs.gruppi }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: bf-surv-*
      - id: merge
        name: Unisci i sopravvissuti + shard per il predict
        run: python best_five.py --merge-prefiltro _artifacts

  predict:
    needs: prefiltro_merge
    if: needs.prefiltro_merge.outputs.gruppi != '' && needs.prefiltro_merge.outputs.gruppi != '[]'
    name: predict ${{ matrix.gruppo.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        gruppo: ${{ fromJson(needs.prefiltro_merge.outputs.gruppi) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - name: Predict shard
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          PYTHONUNBUFFERED: "1"
        run: python best_five.py "${{ inputs.lega || 'kleague' }}" --predict-shard "${{ matrix.gruppo.g }}"
      - if: always()
        run: python pipeline_artifacts.py stage _artifact_stage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bf-pred-${{ strategy.job-index }}
          path: _artifact_stage
          retention-days: 1

  report:
    needs: [prefiltro_merge, predict]
    if: needs.prefiltro_merge.outputs.gruppi != '' && needs.prefiltro_merge.outputs.gruppi != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # NECESSARIO anche qui (bug reale, run 30560983351): best_five.py
      # importa curl_cffi/requests a livello di modulo (per la query
      # starterOdds), quindi fallisce all'IMPORT anche nello step "Costruisci
      # report" che non fa nessuna chiamata di rete -- e best_five_telegram_
      # notify.py importa requests direttamente, stesso problema.
      - run: pip install requests curl_cffi
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: bf-pred-*
      - run: python pipeline_artifacts.py apply _artifacts
      - name: Costruisci report (nessuna chiamata API, solo parsing)
        env:
          # FIX BUG REALE (30/07, segnalato dall'utente): senza questo, la
          # formazione poteva includere giocatori sotto la soglia
          # starterOdds -- prediction_<slug>_*.txt di run precedenti (anche
          # della produzione, stessa cartella) venivano ripescati senza
          # ricontrollare il prefiltro DI QUESTO run. Vedi
          # _sopravvissuti_run_corrente in best_five.py.
          PREFILTRO_GRUPPI: ${{ needs.prefiltro_merge.outputs.gruppi }}
        run: |
          set -u
          ARGS="${{ inputs.lega || 'kleague' }} --backups ${{ inputs.backups || '2' }}"
          if [ -n "${{ inputs.roles }}" ]; then
            ARGS="$ARGS --roles ${{ inputs.roles }}"
          fi
          python best_five.py $ARGS
      - name: Salva risultati
        if: always()
        run: |
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A formazione_*/output/*_gk_all formazione_*/output/*_def_all formazione_*/output/*_mid_all formazione_*/output/*_fwd_all formazione_*/output/best_five 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Best Five: risultati run $(date -u '+%Y-%m-%d %H:%M UTC')"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 5 ]; then
              echo "Impossibile salvare dopo 5 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
      # Notifica DOPO il salvataggio (non "always()": un link a un HTML mai
      # pushato sarebbe rotto) -- stesso schema di formazione_telegram_notify.py.
      # Stesso canale Telegram gia' usato da formazione_giornata/bot_profit/
      # manager_bundle_scan (secrets.BUNDLE_TELEGRAM_TOKEN/_CHAT_ID -> env
      # TELEGRAM_TOKEN/TELEGRAM_CHAT_ID) -- NON i secrets.TELEGRAM_TOKEN/
      # _CHAT_ID semplici, quelli sono il canale separato del tracker prezzi
      # (check.yml).
      - name: Notifica Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.BUNDLE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BUNDLE_TELEGRAM_CHAT_ID }}
          GIT_REF: main
          LEGA: ${{ inputs.lega || 'kleague' }}
        run: python best_five_telegram_notify.py
