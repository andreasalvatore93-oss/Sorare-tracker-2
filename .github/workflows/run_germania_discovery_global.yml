name: Run discovery globale Bundesliga (una tantum)

# Lancia i 4 script germania_<ruolo>_discovery_global.py (29/07, backlog
# discovery_global_big5) e committa i player_slugs.json risultanti.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          PYTHONUNBUFFERED: "1"
        run: |
          python formazione_germania/discovery/germania_gk_discovery_global.py
          python formazione_germania/discovery/germania_def_discovery_global.py
          python formazione_germania/discovery/germania_mid_discovery_global.py
          python formazione_germania/discovery/germania_fwd_discovery_global.py
      - name: Commit risultati
        run: |
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add formazione_germania/output/germania_gk_discovery_global \
                   formazione_germania/output/germania_def_discovery_global \
                   formazione_germania/output/germania_mid_discovery_global \
                   formazione_germania/output/germania_fwd_discovery_global
          git diff --cached --quiet || git commit -m "Discovery globale Bundesliga: player_slugs.json generati"
          git pull --no-edit --no-rebase origin main
          git push origin main
