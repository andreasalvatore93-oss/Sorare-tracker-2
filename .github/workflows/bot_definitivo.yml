name: Bot definitivo
on:
  workflow_dispatch:
    inputs:
      min_price_eur:
        description: "Prezzo minimo carta da valutare (EUR)"
        required: false
        default: "1.50"
      max_price_eur:
        description: "Prezzo massimo carta da valutare (EUR)"
        required: false
        default: "30"
      makeoffer_margin_percent:
        description: "Margine MINIMO per il ramo MakeOffer (offerta scontata), in % (es. 10 = 10%)"
        required: false
        default: "15"
      makeoffer_max_margin_percent:
        description: "Margine MASSIMO per il ramo MakeOffer -- oltre questa soglia interviene AutoBuy"
        required: false
        default: "26"
      offer_discount_percent:
        description: "Sconto ULTERIORE sul minimo per calcolare il prezzo dell'offerta MakeOffer, in %"
        required: false
        default: "15"
      autobuy_margin_percent:
        description: "Margine MINIMO per il ramo AutoBuy (accetta offerta esistente), in % -- deve essere >= makeoffer_max_margin_percent"
        required: false
        default: "26"
      listen_seconds:
        description: "Secondi di ascolto massimi, max 18000 (5h)"
        required: false
        default: "18000"
      commit_interval_seconds:
        description: "Ogni quanti secondi il bot fa commit+push della lista nera DURANTE la run (protezione da interruzioni) -- default 300 = 5 minuti"
        required: false
        default: "300"
      rate_limit_notify_cooldown_seconds:
        description: "Ogni quanti secondi (minimo) notificare su Telegram un HTTP 429 -- una raffica di piu' 429 nella stessa finestra manda UN SOLO avviso"
        required: false
        default: "300"
      target_matches:
        description: "Quanti casi totali (AutoBuy + MakeOffer) notificare prima di fermarsi (1-100)"
        required: false
        default: "10"
      blacklisted_player_slugs:
        description: "Slug giocatori da aggiungere PERMANENTEMENTE alla blacklist unita (separati da virgola)"
        required: false
        default: ""
      check_classic:
        description: "Controlla anche gli annunci CLASSIC (tutti i campionati) -- vale per ENTRAMBI i rami, AutoBuy e MakeOffer, un solo interruttore condiviso"
        required: false
        default: "si"
      min_recent_transactions:
        description: "Transazioni minime (3gg) per non scartare il caso -- protezione mercato sottile"
        required: false
        default: "3"
      min_listed_cards_for_purchase:
        description: "Carte MINIME dello stesso giocatore attualmente IN VENDITA (annunci vivi, non storico) perche' il caso proceda -- protezione mercato poco popolato. MLS/K-League confrontano solo la stagione giusta (season/classic separate), altri campionati mescolano in_season+classic come sempre"
        required: false
        default: "3"
      min_listed_cards_diagnostic:
        description: "'si' = logga anche quando il controllo 'carte in vendita minime' PASSA (utile per verificare che il controllo giri su ogni candidato durante il test). 'no' = logga solo gli scarti, come tutti gli altri controlli."
        required: false
        default: "no"
      recent_avg_price_max_deviation_percent:
        description: "Scarta se il prezzo da pagare/offrire supera di questa percentuale la MEDIA delle ultime (fino a 3) transazioni reali del giocatore -- protezione contro prezzi anomali rispetto allo storico recente"
        required: false
        default: "15"
      recent_avg_price_diagnostic_log:
        description: "'si' = logga il calcolo (prezzi usati, media, deviazione) per OGNI valutazione, non solo quando scarta -- utile per capire quanto spesso il controllo scarterebbe. RICORDARSI DI RIMETTERE 'no' dopo la sessione di verifica, altrimenti resta rumoroso nei log."
        required: false
        default: "si"
      blacklisted_league_slugs:
        description: "Slug CAMPIONATI da aggiungere alla blacklist unita (separati da virgola, es. premiership-gb-sct) -- carte di questi campionati vengono ignorate completamente, default 15gg rinnovabile"
        required: false
        default: ""
      league_blacklist_verbose_log:
        description: "'si' = log dettagliato per OGNI carta scartata per campionato blacklistato (utile per il primo test). 'no' = filtro silenzioso."
        required: false
        default: "no"
      autobuy_live_mode:
        description: "'si' = ACQUISTO REALE AUTOMATICO (ramo AutoBuy). 'no' = solo diagnostica."
        required: false
        default: "si"
      makeoffer_live_mode:
        description: "'si' = OFFERTE REALI AUTOMATICHE (ramo MakeOffer). 'no' = solo diagnostica."
        required: false
        default: "si"
      offer_duration_days:
        description: "Durata dell'offerta MakeOffer in giorni interi, 1-7"
        required: false
        default: "1"
      price_based_thresholds_enabled:
        description: "'si' = soglie basate sul prezzo (26/07). 'no' = torna alle 3 soglie statiche fisse (makeoffer_margin_percent/makeoffer_max_margin_percent/autobuy_margin_percent) -- utile per test diagnostici mirati (es. forzare molti AutoBuy per analisi timing)."
        required: false
        default: "si"
      runner:
        description: "Dove girare: 'casa' = PC dell'utente (latenza verso Sorare dimezzata, 82ms contro 168 -- serve che il PC sia ACCESO, altrimenti il job resta in coda). 'github' = runner GitHub, sempre disponibile ma piu' lento a reagire."
        required: false
        default: "casa"
        type: choice
        options: ["casa", "github"]
      aggressive_mode:
        description: "'si' = MODALITA' AGGRESSIVA: filtro starter odds prossima partita >=80% (hardcoded), thin market e cooldown disattivati, soglie di margine -10% (piu' sensibile). Manager/giocatore/campionato blacklist ecc. restano SEMPRE attivi. SICUREZZA: se attiva insieme a QUALUNQUE input di soglia/sconto modificato dal default (makeoffer_margin_percent/makeoffer_max_margin_percent/autobuy_margin_percent/offer_discount_percent/price_based_thresholds_enabled), forza automaticamente la modalita' SOLO DIAGNOSTICA (combinazione non validata) -- lasciare tutti quegli input al default per farla funzionare con acquisti/offerte reali. 'no' = disattivata, comportamento normale."
        required: false
        default: "no"
permissions:
  contents: write
concurrency:
  group: sorare-bot-supremo
  cancel-in-progress: false

# Su Windows la shell di default dei job sarebbe PowerShell: i nostri step sono
# scritti in bash (test [ -z ], awk, export). Forzarla vale per entrambi i
# runner -- su ubuntu bash e' gia' il default, quindi non cambia niente.
defaults:
  run:
    shell: bash

jobs:
  bot-supremo:
    # 13/08/2026: il bot definitivo puo' girare sul PC di casa, dove la latenza
    # verso Sorare e' meta' di quella di un runner GitHub (mediana 82 ms contro
    # 168, picchi 189 contro 382, misurato il 12/08). Su una gara di sniping,
    # dove si vince o si perde per millisecondi, conta davvero.
    # E' il caso in cui il self-hosted VINCE: un job solo, lungo, che fa tante
    # richieste in fila. Il generatore di formazioni e' il caso opposto (tanti
    # job che devono ricostruirsi il mondo ognuno) e infatti resta su GitHub.
    # L'input 'runner' permette di tornare su GitHub quando il PC e' spento:
    # un job destinato a 'casa' con la macchina spenta resta in coda e basta.
    runs-on: ${{ (github.event.inputs.runner || 'casa') == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","casa"]') }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # NIENTE setup-python / setup-node sul self-hosted (trappola gia' pagata
      # il 12/08): le due action provano a INSTALLARE scrivendo nel registro di
      # sistema, e il servizio del runner gira come SERVIZIO DI RETE, che quel
      # permesso non ce l'ha ("Error happened during Python installation").
      # Sul PC di casa si usano gli interpreti della macchina, installati una
      # volta sola PER TUTTI GLI UTENTI (C:\Program Files\Python311 e
      # C:\Program Files\nodejs) proprio perche' il servizio li veda: le
      # versioni utente/Microsoft Store stanno in AppData e quell'account non
      # le puo' nemmeno leggere.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted'
        with:
          node-version: "20"

      # Meglio fermarsi qui con un messaggio chiaro che tre ore dopo, alla
      # prima firma, con un "node: command not found" dentro un log da 5 ore.
      - name: Gli interpreti ci sono (python e node)
        run: |
          set -u
          echo "runner: ${{ runner.environment }} ($(uname -s 2>/dev/null || echo Windows))"
          python --version
          node --version || {
            echo "::error::Node non e' raggiungibile da questo runner. Sul PC di casa va installato PER TUTTI GLI UTENTI (winget install OpenJS.NodeJS.LTS --scope machine, da amministratore): il servizio del runner non vede le installazioni per il solo utente. Serve per la firma delle transazioni (bots/sorare-sign/decrypt_and_sign.js)."
            exit 1
          }

      - name: Install sorare-sign dependencies
        run: |
          cd bots/sorare-sign
          npm install
      # tzdata serve SOLO su Windows, ma si installa sempre perche' su Linux e'
      # gia' soddisfatto e non costa niente (13/08/2026, trovato dalla prima run
      # sul PC di casa). Python non porta con se' il database dei fusi orari: su
      # Linux lo legge da quello di sistema, su Windows quel database non esiste
      # e ZoneInfo('Europe/Rome') solleva ZoneInfoNotFoundError. Il bot lo usa
      # per scrivere le scadenze della lista nera in ora di Roma, e l'eccezione
      # partiva DENTRO il thread che valuta un annuncio: ogni evento veniva
      # saltato con "eccezione non gestita durante la valutazione", cioe' il bot
      # girava senza valutare niente -- verde, e completamente inutile.
      - run: pip install requests websocket-client curl_cffi tzdata
      - name: Run Bot definitivo
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_VERSION: ${{ secrets.SORARE_VERSION }}
          SORARE_BUILD: ${{ secrets.SORARE_BUILD }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          SORARE_WALLET_PASSWORD: ${{ secrets.SORARE_WALLET_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          AUTOBUY_MIN_PRICE_EUR: ${{ github.event.inputs.min_price_eur || '1.50' }}
          AUTOBUY_MAX_PRICE_EUR: ${{ github.event.inputs.max_price_eur || '30' }}
          MAKEOFFER_MARGIN_PERCENT_INPUT: ${{ github.event.inputs.makeoffer_margin_percent || '15' }}
          MAKEOFFER_MAX_MARGIN_PERCENT_INPUT: ${{ github.event.inputs.makeoffer_max_margin_percent || '26' }}
          AUTOBUY_MARGIN_PERCENT_INPUT: ${{ github.event.inputs.autobuy_margin_percent || '26' }}
          LISTEN_SECONDS: ${{ github.event.inputs.listen_seconds || '18000' }}
          COMMIT_INTERVAL_SECONDS: ${{ github.event.inputs.commit_interval_seconds || '300' }}
          LIQUIDITY_DIAGNOSTIC: "no"
          RATE_LIMIT_NOTIFY_COOLDOWN_SECONDS: ${{ github.event.inputs.rate_limit_notify_cooldown_seconds || '300' }}
          AUTOBUY_TARGET_MATCHES: ${{ github.event.inputs.target_matches || '10' }}
          BLACKLISTED_PLAYER_SLUGS: ${{ github.event.inputs.blacklisted_player_slugs || '' }}
          CHECK_CLASSIC: ${{ github.event.inputs.check_classic || 'si' }}
          MIN_RECENT_TRANSACTIONS: ${{ github.event.inputs.min_recent_transactions || '3' }}
          MIN_LISTED_CARDS_FOR_PURCHASE: ${{ github.event.inputs.min_listed_cards_for_purchase || '3' }}
          MIN_LISTED_CARDS_DIAGNOSTIC: ${{ github.event.inputs.min_listed_cards_diagnostic || 'no' }}
          RECENT_AVG_PRICE_MAX_DEVIATION_PERCENT: ${{ github.event.inputs.recent_avg_price_max_deviation_percent || '15' }}
          RECENT_AVG_PRICE_DIAGNOSTIC_LOG: ${{ github.event.inputs.recent_avg_price_diagnostic_log || 'si' }}
          BLACKLISTED_LEAGUE_SLUGS: ${{ github.event.inputs.blacklisted_league_slugs || '' }}
          LEAGUE_BLACKLIST_VERBOSE_LOG: ${{ github.event.inputs.league_blacklist_verbose_log || 'no' }}
          AUTOBUY_LIVE_MODE: ${{ github.event.inputs.autobuy_live_mode || 'si' }}
          MAKEOFFER_LIVE_MODE: ${{ github.event.inputs.makeoffer_live_mode || 'si' }}
          OFFER_DISCOUNT_PERCENT_INPUT: ${{ github.event.inputs.offer_discount_percent || '15' }}
          OFFER_DURATION_DAYS: ${{ github.event.inputs.offer_duration_days || '1' }}
          MAX_PENDING_OFFERS: "20"
          PRICE_BASED_THRESHOLDS_ENABLED: ${{ github.event.inputs.price_based_thresholds_enabled || 'si' }}
          AGGRESSIVE_MODE: ${{ github.event.inputs.aggressive_mode || 'no' }}
        run: |
          set -o pipefail
          export MAKEOFFER_MARGIN_FRACTION=$(awk -v p="$MAKEOFFER_MARGIN_PERCENT_INPUT" 'BEGIN { printf "%.4f", p / 100 }')
          export MAKEOFFER_MAX_MARGIN_FRACTION=$(awk -v p="$MAKEOFFER_MAX_MARGIN_PERCENT_INPUT" 'BEGIN { printf "%.4f", p / 100 }')
          export AUTOBUY_MARGIN_FRACTION=$(awk -v p="$AUTOBUY_MARGIN_PERCENT_INPUT" 'BEGIN { printf "%.4f", p / 100 }')
          export OFFER_DISCOUNT_FRACTION=$(awk -v p="$OFFER_DISCOUNT_PERCENT_INPUT" 'BEGIN { printf "%.4f", p / 100 }')
          python bots/bot_definitivo.py
      - name: Commit lista nera unica (manager, giocatori, thin market, cooldown acquisti)
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- sorare_lista_nera.txt)" ]; then
            echo "Nessuna modifica alla lista nera, niente da committare."
          else
            git config user.name "bot-definitivo"
            git config user.email "bot-definitivo@users.noreply.github.com"
            git add sorare_lista_nera.txt
            git commit -m "Bot definitivo: aggiorna lista nera unica"
            git pull --rebase --autostash origin main
            git push
          fi
