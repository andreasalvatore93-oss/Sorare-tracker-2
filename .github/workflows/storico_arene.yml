name: Ricostruisci storico arene

# Scarica le classifiche di tutte le arene giocate, giornata per giornata, e le
# accumula in dati_globali/arene_storico.json. Serve la MEDIANA della singola
# arena: e' il campo da battere, e su una giornata sola non si tara niente.
#
# Gira qui e non in locale per due motivi: i segreti ci sono, e soprattutto
# l'IP e' diverso da quello di casa, quindi non consuma il budget di richieste
# che serve ai bot di mercato (in locale li mandava in 429).
#
# Riprende da dove si era fermato: le giornate gia' in archivio non vengono
# riscaricate, quindi si puo' rilanciare quante volte serve.

on:
  workflow_dispatch:
    inputs:
      da:
        description: 'Scarica dalle giornate concluse a partire da questa data (AAAA-MM-GG)'
        required: false
        default: '2025-06-01'
        type: string
      pausa:
        description: 'Secondi di pausa fra le richieste (alzala se prendi 429)'
        required: false
        default: '1.0'
        type: string
      riprova:
        description: 'Riesamina anche le giornate note (per recuperare arene perse)'
        required: false
        default: ''
        type: string
      nickname:
        description: 'Nickname Sorare, per riconoscere la tua riga in classifica'
        required: false
        default: 'Crowss'
        type: string

permissions:
  contents: write

jobs:
  storico:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi

      - name: Ricostruisci lo storico
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          DA: ${{ github.event.inputs.da }}
          PAUSA_SECONDI: ${{ github.event.inputs.pausa }}
          NICKNAME: ${{ github.event.inputs.nickname }}
          RIPROVA: ${{ github.event.inputs.riprova }}
          PYTHONUNBUFFERED: "1"
        run: python ricostruisci_storico_arene.py

      - name: Salva l'archivio
        if: always()
        run: |
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f dati_globali/arene_storico.json
          git diff --cached --quiet && exit 0
          git commit -m "Arene: storico aggiornato"
          until git pull --no-edit --no-rebase origin main && git push origin main; do
            echo "push fallito, retry..."
            sleep 5
          done
