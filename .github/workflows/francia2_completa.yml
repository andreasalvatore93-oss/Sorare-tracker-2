name: Formazione Completa Ligue 2 (Francia) (pipeline unificata GK+DEF+MID+FWD)

# Pipeline unica end-to-end: per ciascuno dei 4 ruoli scopre TUTTE le carte
# possedute (IN_SEASON + CLASSIC), valuta ogni giocatore, produce il
# consiglio di ruolo, poi fonde i 4 consigli in N formazioni ottimali
# (input configurabile). Sostituisce le singole discovery/test/merge per
# ruolo e il workflow di sola fusione, gia' rimossi per pulizia.

on:
  workflow_dispatch:
    inputs:
      num_totale_formazioni:
        description: 'Numero TOTALE di formazioni da generare (deve combaciare con la somma dei 5 tipi sotto, altrimenti la run fallisce subito)'
        required: false
        default: '1'
      num_form_in_season:
        description: 'Numero di formazioni In Season da generare (0 per disattivare questo tipo)'
        required: false
        default: '1'
      num_form_arena_260:
        description: 'Numero di formazioni Arena (5 giocatori, classic ammessi) con cap fisso 260 sulla L10 combinata, 0 per disattivare'
        required: false
        default: '0'
      num_form_arena_220:
        description: 'Numero di formazioni Arena (5 giocatori, classic ammessi) con cap fisso 220 sulla L10 combinata, 0 per disattivare'
        required: false
        default: '0'
      num_form_arena_uncapped:
        description: 'Numero di formazioni Arena (5 giocatori, classic ammessi) senza cap sulla L10 combinata, 0 per disattivare'
        required: false
        default: '0'
      num_form_allstars:
        description: 'Numero di formazioni All Stars da generare (7 giocatori: 1GK/2DEF/2MID/1FWD/1extra, classic ammessi, 0 per disattivare)'
        required: false
        default: '0'
      starter_odds_min:
        description: 'Soglia minima starter-odds (0-1) per includere un giocatore nelle formazioni, es. 0.70. Dato mancante = tenuto per sicurezza.'
        required: false
        default: '0.60'

permissions:
  contents: write

concurrency:
  group: formazione-completa-francia2
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # DISCOVERY: una per ruolo, in parallelo. Ognuna scansiona SIA le carte
  # IN_SEASON che CLASSIC possedute (due passate lato server per tipo),
  # cosi' da poter poi applicare la regola "max 1 classic per formazione"
  # nella fusione finale.
  # ------------------------------------------------------------------
  discover_gk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      player_slugs: ${{ steps.run_discovery.outputs.player_slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Discovery portieri Ligue 2 (Francia) (in_season + classic)
        id: run_discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          MIN_STARTER_ODDS: ${{ github.event.inputs.starter_odds_min }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_francia2/discovery/francia2_gk_discovery.py
      - name: Commit output discovery
        if: always()
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/francia2_gk_discovery/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: discovery GK"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  discover_def:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      player_slugs: ${{ steps.run_discovery.outputs.player_slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Discovery difensori Ligue 2 (Francia) (in_season + classic)
        id: run_discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          MIN_STARTER_ODDS: ${{ github.event.inputs.starter_odds_min }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_francia2/discovery/francia2_def_discovery.py
      - name: Commit output discovery
        if: always()
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/francia2_def_discovery/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: discovery DEF"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  discover_mid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      player_slugs: ${{ steps.run_discovery.outputs.player_slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Discovery centrocampisti Ligue 2 (Francia) (in_season + classic)
        id: run_discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          MIN_STARTER_ODDS: ${{ github.event.inputs.starter_odds_min }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_francia2/discovery/francia2_mid_discovery.py
      - name: Commit output discovery
        if: always()
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/francia2_mid_discovery/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: discovery MID"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  discover_fwd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      player_slugs: ${{ steps.run_discovery.outputs.player_slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Discovery attaccanti Ligue 2 (Francia) (in_season + classic)
        id: run_discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          MIN_STARTER_ODDS: ${{ github.event.inputs.starter_odds_min }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_francia2/discovery/francia2_fwd_discovery.py
      - name: Commit output discovery
        if: always()
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/francia2_fwd_discovery/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: discovery FWD"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  # ------------------------------------------------------------------
  # PREDICT: matrix per giocatore, un job runner ciascuno (budget
  # complessita' API fresco per processo), parametri gia' fissati per
  # tutti e 4 i ruoli (fase di produzione, non calibrazione).
  # ------------------------------------------------------------------
  predict_gk:
    needs: discover_gk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        player_slug: ${{ fromJson(needs.discover_gk.outputs.player_slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Predict GK
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_francia2/predict/test_gk.py
      - name: Upload output come artifact (evita contese di git push tra job paralleli)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-francia2-gk-${{ matrix.player_slug }}
          path: |
            formazione_francia2/output/francia2_gk_all/prediction_${{ matrix.player_slug }}_*.txt
            formazione_francia2/output/francia2_gk_all/.cache/${{ matrix.player_slug }}_detail_cache.json
            formazione_francia2/output/francia2_gk_all/.game_log_cache/${{ matrix.player_slug }}_gamelog.json
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: true

  predict_def:
    needs: discover_def
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        player_slug: ${{ fromJson(needs.discover_def.outputs.player_slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Predict DEF
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_francia2/predict/test_def.py
      - name: Upload output come artifact (evita contese di git push tra job paralleli)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-francia2-def-${{ matrix.player_slug }}
          path: |
            formazione_francia2/output/francia2_def_all/prediction_${{ matrix.player_slug }}_*.txt
            formazione_francia2/output/francia2_def_all/.cache/${{ matrix.player_slug }}_detail_cache.json
            formazione_francia2/output/francia2_def_all/.game_log_cache/${{ matrix.player_slug }}_gamelog.json
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: true

  predict_mid:
    needs: discover_mid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        player_slug: ${{ fromJson(needs.discover_mid.outputs.player_slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Predict MID
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_francia2/predict/test_mid.py
      - name: Upload output come artifact (evita contese di git push tra job paralleli)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-francia2-mid-${{ matrix.player_slug }}
          path: |
            formazione_francia2/output/francia2_mid_all/prediction_${{ matrix.player_slug }}_*.txt
            formazione_francia2/output/francia2_mid_all/.cache/${{ matrix.player_slug }}_detail_cache.json
            formazione_francia2/output/francia2_mid_all/.game_log_cache/${{ matrix.player_slug }}_gamelog.json
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: true

  predict_fwd:
    needs: discover_fwd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        player_slug: ${{ fromJson(needs.discover_fwd.outputs.player_slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Predict FWD
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_francia2/predict/test_mls_fwd_all.py
      - name: Upload output come artifact (evita contese di git push tra job paralleli)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-francia2-fwd-${{ matrix.player_slug }}
          path: |
            formazione_francia2/output/francia2_fwd_all/prediction_${{ matrix.player_slug }}_*.txt
            formazione_francia2/output/francia2_fwd_all/.cache/${{ matrix.player_slug }}_detail_cache.json
            formazione_francia2/output/francia2_fwd_all/.game_log_cache/${{ matrix.player_slug }}_gamelog.json
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: true

  # ------------------------------------------------------------------
  # MERGE: riepilogo compatto per ruolo (consiglio_<ts>.txt).
  # ------------------------------------------------------------------
  merge_gk:
    needs: [discover_gk, predict_gk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scarica output predict (artifact aggregati, un solo commit invece di N)
        uses: actions/download-artifact@v4
        with:
          pattern: predict-francia2-gk-*
          path: formazione_francia2/output/francia2_gk_all
          merge-multiple: true
        continue-on-error: true
      - name: Consiglio GK
        run: python formazione_francia2/consiglio/build_consiglio_gk.py
      - name: Commit predict+riepilogo
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/francia2_gk_all/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: predict+consiglio GK"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  merge_def:
    needs: [discover_def, predict_def]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scarica output predict (artifact aggregati, un solo commit invece di N)
        uses: actions/download-artifact@v4
        with:
          pattern: predict-francia2-def-*
          path: formazione_francia2/output/francia2_def_all
          merge-multiple: true
        continue-on-error: true
      - name: Consiglio DEF
        run: python formazione_francia2/consiglio/build_consiglio_def.py
      - name: Commit predict+riepilogo
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/francia2_def_all/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: predict+consiglio DEF"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  merge_mid:
    needs: [discover_mid, predict_mid]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scarica output predict (artifact aggregati, un solo commit invece di N)
        uses: actions/download-artifact@v4
        with:
          pattern: predict-francia2-mid-*
          path: formazione_francia2/output/francia2_mid_all
          merge-multiple: true
        continue-on-error: true
      - name: Consiglio MID
        run: python formazione_francia2/consiglio/build_consiglio_mid.py
      - name: Commit predict+riepilogo
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/francia2_mid_all/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: predict+consiglio MID"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  merge_fwd:
    needs: [discover_fwd, predict_fwd]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scarica output predict (artifact aggregati, un solo commit invece di N)
        uses: actions/download-artifact@v4
        with:
          pattern: predict-francia2-fwd-*
          path: formazione_francia2/output/francia2_fwd_all
          merge-multiple: true
        continue-on-error: true
      - name: Consiglio FWD
        run: python formazione_francia2/consiglio/build_consiglio.py
      - name: Commit predict+riepilogo
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/francia2_fwd_all/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: predict+consiglio FWD"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  # ------------------------------------------------------------------
  # FUSIONE FINALE: legge i 4 consigli appena prodotti e genera N
  # formazioni ottimali (input num_formazioni).
  # ------------------------------------------------------------------
  formazione_finale:
    needs: [merge_gk, merge_def, merge_mid, merge_fwd]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Genera formazione(i) ottimale(i)
        env:
          NUM_TOTALE_FORMAZIONI: ${{ github.event.inputs.num_totale_formazioni }}
          NUM_FORM_IN_SEASON: ${{ github.event.inputs.num_form_in_season }}
          NUM_FORM_ARENA_260: ${{ github.event.inputs.num_form_arena_260 }}
          NUM_FORM_ARENA_220: ${{ github.event.inputs.num_form_arena_220 }}
          NUM_FORM_ARENA_UNCAPPED: ${{ github.event.inputs.num_form_arena_uncapped }}
          NUM_FORM_ALLSTARS: ${{ github.event.inputs.num_form_allstars }}
        run: python formazione_francia2/build_formazione_finale.py
      - name: Commit formazione(i)
        run: |
          git config user.name "francia2-formazione-bot"
          git config user.email "francia2-formazione-bot@users.noreply.github.com"
          git add formazione_francia2/output/formazione_finale_*.txt formazione_francia2/output/formazione_finale_*.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Formazione Completa: formazione finale (totale=${{ github.event.inputs.num_totale_formazioni }})"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
