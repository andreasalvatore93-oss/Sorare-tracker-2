name: Scouting acquisti

# Chi vale la pena COMPRARE per una giornata, tutte le leghe insieme, prima che
# escano le starter odds (Sorare le pubblica a 24-48h dal calcio d'inizio,
# troppo tardi per comprare con calma).
#
# Un solo input obbligatorio: quanti candidati per ruolo. Nessuna lega da
# scrivere a mano -- le leghe le scopre il tool dal pool, e un solo slug
# sbagliato qui dentro non darebbe errore, darebbe zero risultati in silenzio.
#
# Tre job:
#   1. candidati   searchPlayers (~12 query, 7 secondi), scrive le discovery e
#                  l'elenco dei predict da fare
#   2. predict     UNA MATRICE, un giocatore per job -- vedi sotto
#   3. consigli    consigli, report, commit, Telegram
#
# PERCHE' LA MATRICE (imparato male il 02/08, dopo che l'utente l'aveva fatto
# notare tre volte): la prima versione faceva i predict in un ciclo sequenziale
# dentro un job solo, e 155 candidati costavano 68 minuti. La calibrazione di
# produzione fa la stessa identica cosa con `max-parallel: 8` e un giocatore per
# job, e ne fa 185 in mezz'ora. Il tempo PER GIOCATORE e' lo stesso (20-60s):
# cambia solo che li spalma.
#
# L'obiezione "il rate limit e' sull'account, quindi parallelizzare non serve"
# vale per job che fanno MIGLIAIA di query a testa -- la scrematura a 8 shard
# del 02/08, otto job e otto 429. Un job per giocatore fa poche decine di
# chiamate e poi muore: e' il regime in cui la calibrazione gira da sempre senza
# problemi.
# ATTENZIONE (corretto il 07/08): questo commento diceva "max-parallel: 8 e' il
# suo stesso valore, tarato li'", ma il codice usa 20 dalla riga ~164, e per un
# motivo MISURATO (a 8 la matrice era 2.5x piu' lenta: 126 predict in ~24 min
# invece di ~10, run 30814827740). Chi leggeva solo qui credeva a un valore che
# non e' quello in uso: il numero vero e la sua ragione stanno accanto a
# max-parallel, non qui.
#
# ATTENZIONE: il job 1 SOVRASCRIVE la discovery di produzione delle leghe
# toccate. La prossima run di `formazione_giornata` la rigenera (e' il suo primo
# job), ma fino ad allora un run manuale dei predict userebbe questa lista.

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: 'Numero di giornata (es. 2). Vuoto = prossima giornata aperta'
        required: false
        default: ''
        type: string
      odds_min:
        description: 'Soglia starter-odds 0-1 (es. 0.80). Odds uscite: analizza tutti quelli >= soglia. Odds non uscite: analizza tutto il pool.'
        required: false
        default: '0.80'
        type: string
      predict:
        description: 'Far girare il modello sui candidati (riempie la colonna Atteso)'
        required: false
        default: true
        type: boolean
      screma:
        description: 'Controllo 2-su-3 sulle ultime partite (non filtra, marca soltanto)'
        required: false
        default: false
        type: boolean
      riusa_predizioni:
        description: 'Riusa le previsioni gia'' calcolate per questa giornata (piu'' veloce, ma non ricalcola con G)'
        required: false
        default: false
        type: boolean
      minimal:
        description: 'Tabella minima: giocatore/ruolo/club/odds/prezzo/atteso/grade (niente arene ne'' essenze/GW)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  candidati:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      lavori: ${{ steps.lista.outputs.lavori }}
      quanti: ${{ steps.lista.outputs.quanti }}
      # quanti = quelli che la matrice fara' davvero (max 256); richiesti =
      # quanti ne servivano. Se differiscono, dei candidati restano senza
      # Atteso: serve saperlo a valle, non solo nel log.
      richiesti: ${{ steps.lista.outputs.richiesti }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install -r requirements-formazione.txt
      - run: pip install curl_cffi websocket-client

      # Il cookie serve: senza, searchPlayers viene respinta dai limiti di
      # complessita' dopo la prima pagina (misurato il 02/08).
      - name: Trova i candidati e scrivi le discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          # Chiavi 2 e 3: i tetti Sorare sono per chiave e si sommano
          # (200/min l'una). Chi le ruota le usa, chi non le ruota le
          # ignora e resta al comportamento di prima.
          SORARE_APIKEY_2: ${{ secrets.SORARE_APIKEY_2 }}
          SORARE_APIKEY_3: ${{ secrets.SORARE_APIKEY_3 }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          SCOUTING_RIUSA_PREDIZIONI: ${{ inputs.riusa_predizioni && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ -n "${{ inputs.gameweek }}" ]; then ARGS="$ARGS --gameweek ${{ inputs.gameweek }}"; fi
          if [ -n "${{ inputs.odds_min }}" ]; then ARGS="$ARGS --odds-min ${{ inputs.odds_min }}"; fi
          if [ "${{ inputs.screma }}" = "true" ]; then ARGS="$ARGS --screen"; fi
          if [ "${{ inputs.predict }}" = "true" ]; then ARGS="$ARGS --scrivi-discovery"; fi
          if [ "${{ inputs.minimal }}" = "true" ]; then ARGS="$ARGS --minimal"; fi
          python scouting_gw.py $ARGS --html generatore_formazioni/output/scouting_ultimo.html

      # Le discovery vanno su main PRIMA della matrice: ogni job della matrice
      # fa il proprio checkout e deve trovarcele.
      - name: Salva discovery e pool
        if: ${{ inputs.predict }}
        run: |
          git config user.name  "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          # add SEPARATI: un pathspec che non matcha (es. il pool ancora non
          # scritto) fa fallire l'INTERO 'git add' combinato -- ed e' quello che
          # e' successo (run 30817534591): 'dati_globali/scouting_*.json' plain
          # non matchava il file untracked, abortiva tutto, e ne' discovery ne'
          # pool venivano committati -> --riusa-pool poi non trovava il pool.
          # Il glob del pool usa :(glob) come player_slugs (matcha gli untracked).
          # scouting_*.json porta il PREZZO MINIMO ancorato alla fixture e serve
          # a --riusa-pool nel job report.
          git add ':(glob)formazione_*/output/**/player_slugs.json' || true
          git add dati_globali/scouting_da_predire.tsv dati_globali/scouting_lavori.txt || true
          git add -f ':(glob)dati_globali/scouting_*.json' || true
          git commit -m "Scouting: discovery dei candidati" || echo "niente da committare"
          # Push a prova di conflitto: se un'altra run (es. il generatore) ha
          # toccato gli stessi player_slugs.json, il rebase andava in CONFLICT e
          # il job moriva (run 30811889298). Le discovery di scouting sono cio'
          # che vogliamo per QUESTA run: in caso di conflitto vince la nostra
          # versione (-X ours), stesso schema del job predict.
          tentativo=0
          until git push origin main; do
            tentativo=$((tentativo + 1))
            [ $tentativo -ge 15 ] && { echo "push fallito 15 volte, abbandono"; exit 1; }
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main || true
          done

      # Una voce per giocatore, "lega|ruolo|slug". La matrice di GitHub ne
      # accetta al massimo 256: si tronca dicendolo, invece di fallire.
      # La lista la scrive scouting_gw.py, che sa gia' chi ha una previsione
      # valida per QUESTA giornata e lo esclude (best_five._predizione_
      # riutilizzabile, agganciata alla finestra della fixture). Alla seconda
      # run sulla stessa giornata la matrice e' quasi vuota: non e' un refresh
      # leggero, e' zero query.
      - name: Prepara la lista dei predict
        id: lista
        if: ${{ inputs.predict }}
        run: |
          # NIENTE che non sia chiave=valore su stdout (13/08/2026): qui lo
          # stdout FINISCE dentro $GITHUB_OUTPUT, che accetta solo quel
          # formato. La riga '::warning::...' ci finiva dentro e faceva
          # fallire il job con "Unable to process file command 'output'
          # successfully / Invalid format" -- proprio nel caso che il
          # commento qui sopra dice di voler gestire senza fallire (run
          # 31675855737, 1543 predict richiesti: la prima volta che si e'
          # superato il tetto). L'avviso va nel riepilogo della run e nel
          # log, non nel file degli output.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          lavori = []
          f = 'dati_globali/scouting_lavori.txt'
          if os.path.exists(f):
              lavori = [r.strip() for r in open(f, encoding='utf-8') if r.strip()]
          richiesti = len(lavori)
          if richiesti > 256:
              avviso = (f'{richiesti} predict richiesti, la matrice GitHub ne accetta '
                        f'256: ne restano fuori {richiesti - 256}, che nella tabella '
                        f'dello scouting resteranno senza Atteso.')
              print(f'AVVISO: {avviso}', file=sys.stderr)
              riepilogo = os.environ.get('GITHUB_STEP_SUMMARY')
              if riepilogo:
                  with open(riepilogo, 'a', encoding='utf-8') as r:
                      r.write(f'**Predict troncati** -- {avviso}\n')
              lavori = lavori[:256]
          print(f'lavori={json.dumps(lavori)}')
          print(f'quanti={len(lavori)}')
          print(f'richiesti={richiesti}')
          PY

  predict:
    needs: candidati
    if: ${{ inputs.predict && needs.candidati.outputs.quanti != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Stesso valore della calibrazione di produzione, tarato li'.
      # 20 = il vero tetto di concorrenza dell'account (lo stesso che usa la
      # matrice predict del generatore, verificato). A 8 la matrice scouting era
      # inutilmente 2.5x piu' lenta: 126 predict ci mettevano ~24 min (run
      # 30814827740) invece di ~10.
      max-parallel: 20
      matrix:
        lavoro: ${{ fromJson(needs.candidati.outputs.lavori) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi websocket-client

      - name: Predict
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          # Chiavi 2 e 3: i tetti Sorare sono per chiave e si sommano
          # (200/min l'una). Chi le ruota le usa, chi non le ruota le
          # ignora e resta al comportamento di prima.
          SORARE_APIKEY_2: ${{ secrets.SORARE_APIKEY_2 }}
          SORARE_APIKEY_3: ${{ secrets.SORARE_APIKEY_3 }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          IFS='|' read -r LEGA RUOLO SLUG <<< "${{ matrix.lavoro }}"
          case "$RUOLO" in
            gk)  PY=test_gk.py ;;
            def) PY=test_def.py ;;
            mid) PY=test_mid.py ;;
            fwd) PY=test_mls_fwd_all.py ;;
          esac
          if [ ! -f "formazione_$LEGA/predict/$PY" ]; then
            echo "::warning::manca formazione_$LEGA/predict/$PY"
            exit 0
          fi
          TARGET_SLUG="$SLUG" python "formazione_$LEGA/predict/$PY"

      # Commit per giocatore con retry, come la calibrazione: con otto job che
      # scrivono insieme il push va in conflitto di continuo, e perdere la cache
      # di un giocatore significa ripagarne l'assorbimento a ritroso.
      - name: Salva previsione e cache
        if: always()
        run: |
          IFS='|' read -r LEGA RUOLO SLUG <<< "${{ matrix.lavoro }}"
          git config user.name  "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f ':(glob)formazione_*/output/**/.cache/*' \
                     ':(glob)formazione_*/output/**/.game_log_cache/*' || true
          git add ':(glob)formazione_*/output/**/prediction_*.txt' \
                  ':(glob)formazione_*/output/**/prediction_log.json' \
                  ':(glob)formazione_*/output/**/grid_search/*' || true
          if git diff --cached --quiet; then echo "niente da salvare"; exit 0; fi
          git commit -m "Scouting: predict $LEGA/$RUOLO $SLUG"
          tentativo=0
          until git push; do
            tentativo=$((tentativo + 1))
            [ $tentativo -ge 15 ] && { echo "push fallito 15 volte, abbandono"; exit 1; }
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main || true
          done

  consigli:
    needs: [candidati, predict]
    if: ${{ always() && inputs.predict }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install -r requirements-formazione.txt
      - run: pip install curl_cffi websocket-client

      - name: Consigli
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          # Chiavi 2 e 3: i tetti Sorare sono per chiave e si sommano
          # (200/min l'una). Chi le ruota le usa, chi non le ruota le
          # ignora e resta al comportamento di prima.
          SORARE_APIKEY_2: ${{ secrets.SORARE_APIKEY_2 }}
          SORARE_APIKEY_3: ${{ secrets.SORARE_APIKEY_3 }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          while IFS=$'\t' read -r LEGA RUOLO QUANTI; do
            [ -n "$LEGA" ] || continue
            case "$RUOLO" in
              gk)  CO=build_consiglio_gk.py ;;
              def) CO=build_consiglio_def.py ;;
              mid) CO=build_consiglio_mid.py ;;
              fwd) CO=build_consiglio.py ;;
            esac
            [ -f "formazione_$LEGA/consiglio/$CO" ] || continue
            python "formazione_$LEGA/consiglio/$CO" >/dev/null || echo "   consiglio non generato: $LEGA/$RUOLO"
          done < dati_globali/scouting_da_predire.tsv
          set -e

      # Rigenerato DOPO i consigli: e' il passaggio che riempie la colonna
      # "Atteso" e compone le arene.
      - name: Report
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          # Chiavi 2 e 3: i tetti Sorare sono per chiave e si sommano
          # (200/min l'una). Chi le ruota le usa, chi non le ruota le
          # ignora e resta al comportamento di prima.
          SORARE_APIKEY_2: ${{ secrets.SORARE_APIKEY_2 }}
          SORARE_APIKEY_3: ${{ secrets.SORARE_APIKEY_3 }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          PYTHONUNBUFFERED: "1"
        run: |
          # --riusa-pool: il report NON ricostruisce il pool con searchPlayers+
          # odds (che a un'ora di distanza da 'candidati' da' un set diverso e
          # lascia senza Atteso i candidati non piu' selezionati). Carica lo
          # stesso pool committato da 'candidati', cosi' i mostrati sono
          # esattamente i predetti, tutti con l'Atteso.
          # --odds-min serve solo al FALLBACK (se il pool committato manca):
          # con --riusa-pool presente e il pool trovato, si usa quello e le odds
          # non si riguardano.
          ARGS=""
          if [ -n "${{ inputs.gameweek }}" ]; then ARGS="$ARGS --gameweek ${{ inputs.gameweek }}"; fi
          if [ -n "${{ inputs.odds_min }}" ]; then ARGS="$ARGS --odds-min ${{ inputs.odds_min }}"; fi
          if [ "${{ inputs.minimal }}" = "true" ]; then ARGS="$ARGS --minimal"; fi
          python scouting_gw.py $ARGS --riusa-pool --html generatore_formazioni/output/scouting_ultimo.html

      - name: Commit di report, consigli e cache
        if: always()
        run: |
          git config user.name  "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add generatore_formazioni/output/scouting_ultimo.html
          git add -f ':(glob)formazione_*/output/**/.cache/*' \
                     ':(glob)formazione_*/output/**/.game_log_cache/*' || true
          git add ':(glob)formazione_*/output/**/consiglio_*.txt' \
                  ':(glob)formazione_*/output/**/prediction_log.json' || true
          # Pool della giornata col prezzo minimo, ancorato alla fixture.
          # :(glob) per matchare anche il file untracked (plain non lo fa).
          git add -f ':(glob)dati_globali/scouting_*.json' || true
          git commit -m "Scouting acquisti: report e consigli" || echo "niente da committare"
          tentativo=0
          until git push origin main; do
            tentativo=$((tentativo + 1))
            [ $tentativo -ge 15 ] && { echo "push fallito 15 volte, abbandono"; exit 1; }
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main || true
          done

      - name: Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scouting_telegram_notify.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scouting-candidati
          path: |
            dati_globali/scouting_*.json
            generatore_formazioni/output/scouting_ultimo.html
          retention-days: 30
          if-no-files-found: warn
