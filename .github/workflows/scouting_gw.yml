name: Scouting acquisti

# Chi vale la pena COMPRARE per una giornata, tutte le leghe insieme, prima che
# escano le starter odds (Sorare le pubblica a 24-48h dal calcio d'inizio,
# troppo tardi per comprare con calma).
#
# Un solo input obbligatorio: quanti candidati per ruolo. Nessuna lega da
# scrivere a mano -- le leghe le scopre il tool dal pool, e un solo slug
# sbagliato qui dentro non darebbe errore, darebbe zero risultati in silenzio.
#
# Cosa fa, in ordine:
#   1. scouting_gw.py trova i candidati della giornata (searchPlayers: una
#      query paginata, ~7 secondi) e tiene i migliori per L10 in ogni ruolo,
#      MESCOLANDO le leghe -- il confronto interessante e' fra tutti i
#      centrocampisti comprabili, non dentro un campionato.
#   2. scrive il player_slugs.json da cui i predict gia' leggono, e l'elenco di
#      cosa e' stato scritto; i predict girano su quella lista senza che nessuno
#      li modifichi.
#   3. consigli -> colonna "Atteso" del report HTML -> commit su main ->
#      link su Telegram.
#
# ATTENZIONE: il passo 2 SOVRASCRIVE la discovery di produzione delle leghe
# toccate. La prossima run di `formazione_giornata` la rigenera da se' (e' il
# suo primo job), ma fino ad allora un run manuale dei predict userebbe questa
# lista invece delle carte possedute. E' il motivo per cui il campione e'
# piccolo di default.
#
# Le odds non servono: MIN_STARTER_ODDS e' a 0 dal 28/07, il predict gira anche
# su chi non le ha ancora -- che e' il caso normale quando si compra in anticipo.

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: 'Numero di giornata (es. 2). Vuoto = prossima giornata aperta'
        required: false
        default: ''
        type: string
      per_ruolo:
        description: 'Quanti candidati per ruolo, su TUTTE le leghe insieme (10 = ~40 giocatori)'
        required: false
        default: '10'
        type: string
      odds_min:
        description: 'Soglia starter-odds 0-1 (es. 0.80). Vuoto = spento. Odds assenti = escluso'
        required: false
        default: ''
        type: string
      predict:
        description: 'Far girare il modello sui candidati (piu lento, riempie la colonna Atteso)'
        required: false
        default: true
        type: boolean
      screma:
        description: 'Controllo 2-su-3 sulle ultime partite (non filtra, marca soltanto)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scouting:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install -r requirements-formazione.txt
      - run: pip install curl_cffi websocket-client

      # Il cookie serve: senza, searchPlayers viene respinta dai limiti di
      # complessita' dopo la prima pagina (misurato il 02/08).
      - name: 1. Candidati della giornata
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--per-ruolo ${{ inputs.per_ruolo }}"
          if [ -n "${{ inputs.gameweek }}" ]; then ARGS="$ARGS --gameweek ${{ inputs.gameweek }}"; fi
          if [ -n "${{ inputs.odds_min }}" ]; then ARGS="$ARGS --odds-min ${{ inputs.odds_min }}"; fi
          if [ "${{ inputs.screma }}" = "true" ]; then ARGS="$ARGS --screen"; fi
          if [ "${{ inputs.predict }}" = "true" ]; then ARGS="$ARGS --scrivi-discovery"; fi
          python scouting_gw.py $ARGS --html generatore_formazioni/output/scouting_ultimo.html

      # Le leghe da elaborare escono dal passo 1, non da un input: nessuno deve
      # sapere che la Liga MX si chiama 'messico' nel filesystem.
      - name: 2. Predict e consigli
        if: ${{ inputs.predict }}
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          INDICE=dati_globali/scouting_da_predire.tsv
          if [ ! -s "$INDICE" ]; then echo "nessuna discovery scritta, salto"; exit 0; fi
          while IFS=$'\t' read -r LEGA RUOLO QUANTI; do
            [ -n "$LEGA" ] || continue
            case "$RUOLO" in
              gk)  PY=test_gk.py;  CO=build_consiglio_gk.py ;;
              def) PY=test_def.py; CO=build_consiglio_def.py ;;
              mid) PY=test_mid.py; CO=build_consiglio_mid.py ;;
              fwd) PY=test_mls_fwd_all.py; CO=build_consiglio.py ;;
            esac
            if [ ! -f "formazione_$LEGA/predict/$PY" ]; then
              echo ">> manca formazione_$LEGA/predict/$PY, salto ($QUANTI giocatori)"
              continue
            fi
            echo ">> $LEGA/$RUOLO: $QUANTI giocatori"
            # Un giocatore per processo, come in produzione: il tetto di
            # complessita' dell'API riparte pieno a ogni avvio.
            for SLUG in $(python -c "import json,sys;print(' '.join(json.load(open(sys.argv[1]))))" \
                          "formazione_$LEGA/output/${LEGA}_${RUOLO}_discovery/player_slugs.json"); do
              TARGET_SLUG="$SLUG" python "formazione_$LEGA/predict/$PY" >/dev/null \
                || echo "   predict fallito: $SLUG"
            done
            [ -f "formazione_$LEGA/consiglio/$CO" ] && \
              python "formazione_$LEGA/consiglio/$CO" >/dev/null || echo "   consiglio non generato"
          done < "$INDICE"
          set -e

      # Rigenerato DOPO i consigli: e' il passaggio che riempie la colonna
      # "Atteso" (prima sarebbe vuota).
      - name: 3. Report
        if: ${{ inputs.predict }}
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--per-ruolo ${{ inputs.per_ruolo }}"
          if [ -n "${{ inputs.gameweek }}" ]; then ARGS="$ARGS --gameweek ${{ inputs.gameweek }}"; fi
          if [ -n "${{ inputs.odds_min }}" ]; then ARGS="$ARGS --odds-min ${{ inputs.odds_min }}"; fi
          python scouting_gw.py $ARGS --html generatore_formazioni/output/scouting_ultimo.html

      # Il link Telegram passa da raw.githack, che serve il file da GitHub:
      # deve essere gia' su main quando parte la notifica.
      # Si committa ANCHE la cache dei predict, non solo il report. I predict
      # scrivono `.cache` (dettaglio giocatore) e `.game_log_cache` (storico
      # partite) negli stessi percorsi che usa il generatore di produzione:
      # buttarle via a fine job significherebbe ripagare 33 secondi a giocatore
      # (misurato il 02/08 a freddo) la prossima volta che quel giocatore
      # serve, sia qui sia quando lo si schiera davvero dopo averlo comprato.
      #
      # Vale anche al contrario, ed e' il motivo per cui non c'e' niente da
      # scrivere: per un giocatore gia' posseduto la cache del generatore e'
      # gia' in repo, e il predict la trova da solo perche' legge dalla stessa
      # cartella. Nessun doppio lavoro.
      # always(): la cache vale piu' del report. Se il job viene interrotto, va
      # in timeout o un predict fa saltare tutto, questi 30-40 minuti di
      # assorbimento a ritroso NON devono andare persi -- si ripagherebbero
      # daccapo alla run dopo. Senza questa riga il passo non gira proprio.
      - name: 4. Commit di report e cache
        if: always()
        run: |
          git config user.name  "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add generatore_formazioni/output/scouting_ultimo.html
          # Pathspec :(glob), non un glob di shell: senza, git non scende nelle
          # cartelle che iniziano con un punto e la add fallisce con
          # "did not match any files" (verificato).
          git add -f ':(glob)formazione_*/output/**/.cache/*' \
                     ':(glob)formazione_*/output/**/.game_log_cache/*' || true
          git add ':(glob)formazione_*/output/**/prediction_log.json' || true
          git commit -m "Scouting acquisti: report candidati e cache dei predict" \
            || echo "niente da committare"
          git pull --rebase --autostash origin main || true
          git push origin main

      - name: 5. Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scouting_telegram_notify.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scouting-candidati
          path: |
            dati_globali/scouting_*.json
            generatore_formazioni/output/scouting_ultimo.html
          retention-days: 30
          if-no-files-found: warn
