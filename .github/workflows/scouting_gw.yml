name: Scouting giornata (pool senza odds)

# Costruisce e screma il pool di una giornata FUTURA, prima che Sorare
# pubblichi le starter odds (escono a 24-48h dal calcio d'inizio, troppo tardi
# per decidere un acquisto).
#
# L'aggancio e' la fixture: so5Fixture(slug).anyGames elenca le partite CON le
# squadre ed e' interrogabile appena la giornata esiste, anche mentre quella
# precedente e' ancora in corso. Chi non gioca in uno di quei club non e' un
# candidato: filtro esatto, una query.
#
# Tre fasi:
#   pool     1 query fixture + 1 per club (~75, mezzo minuto)
#   scrematura  1 query a giocatore, divisa in quote parallele
#   unione   nessuna query, solo il report
#
# La giornata si passa come numero (2, 3, ...) o come slug esatto, che ha la
# precedenza. Entrambi vuoti = prossima giornata aperta.

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: 'Numero di giornata (es. 2). Vuoto = prossima giornata aperta'
        required: false
        default: ''
        type: string
      fixture:
        description: 'Slug fixture esatto (es. football-4-7-aug-2026). Ha la precedenza sul numero'
        required: false
        default: ''
        type: string
      screma:
        description: 'Scremare con le ultime partite giocate (1 query a giocatore)'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      gameweek: { required: false, default: '', type: string }
      fixture: { required: false, default: '', type: string }
      screma: { required: false, default: true, type: boolean }

permissions:
  contents: write

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install requests curl_cffi

      - name: Costruisci il pool della giornata
        env:
          # I roster dei club sono pubblici (verificato senza cookie il
          # 02/08), ma il cookie alza il tetto di rate limit da 20 a 60
          # richieste al minuto: si passa comunque.
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ -n "${{ inputs.fixture }}" ]; then
            ARGS="--fixture ${{ inputs.fixture }}"
          elif [ -n "${{ inputs.gameweek }}" ]; then
            ARGS="--gameweek ${{ inputs.gameweek }}"
          fi
          python scouting_gw.py $ARGS

      # Artifact e non commit: il pool pesa mezzo mega a giornata e si rigenera
      # in 30 secondi. Ogni file nell'albero lo paga il checkout di OGNI job
      # (la sessione del 30/07 ha guadagnato 10 secondi a job togliendo
      # dall'albero file rigenerabili).
      - uses: actions/upload-artifact@v4
        with:
          name: scouting-pool
          path: dati_globali/scouting_*.json
          retention-days: 14
          if-no-files-found: error

  scrematura:
    needs: pool
    if: ${{ inputs.screma }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        quota: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install requests curl_cffi
      - uses: actions/download-artifact@v4
        with: { name: scouting-pool, path: pool }

      - name: Screma la quota ${{ matrix.quota }}
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SCOUTING_SHARD: "${{ matrix.quota }}:8"
          PYTHONUNBUFFERED: "1"
        run: |
          POOL=$(ls pool/scouting_*.json | head -1)
          mkdir -p quote
          python scouting_gw.py --da-pool "$POOL" \
            --json "quote/$(basename ${POOL%.json})_q${{ matrix.quota }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: scouting-quota-${{ matrix.quota }}
          path: quote/*.json
          retention-days: 14
          if-no-files-found: error

  unione:
    needs: scrematura
    if: ${{ inputs.screma }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { pattern: scouting-quota-*, path: quote }

      - name: Unisci le quote ed elenca i candidati
        run: python scouting_gw.py --unisci quote --json dati_globali/scouting_idonei.json

      - uses: actions/upload-artifact@v4
        with:
          name: scouting-idonei
          path: dati_globali/scouting_idonei.json
          retention-days: 30
          if-no-files-found: error
