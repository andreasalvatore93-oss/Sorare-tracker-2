name: Scouting giornata (pool senza odds)

# Costruisce e screma il pool di una giornata FUTURA, prima che Sorare
# pubblichi le starter odds (escono a 24-48h dal calcio d'inizio, troppo tardi
# per decidere un acquisto).
#
# L'aggancio e' la fixture: so5Fixture(slug).anyGames elenca le partite CON le
# squadre ed e' interrogabile appena la giornata esiste, anche mentre quella
# precedente e' ancora in corso. Chi non gioca in uno di quei club non e' un
# candidato: filtro esatto, una query.
#
# Il percorso vivo e' searchPlayers, la query dietro la pagina Scouting di
# Sorare: ~12 chiamate paginate, 7 secondi, e porta gia' L5/L10/L40, presenze,
# infortuni, proiezione, carte possedute e prezzo minimo. Il vecchio percorso
# (roster club per club, ~75 query, poi 1 query a giocatore su ~2.400) resta in
# scouting_gw.py dietro --roster come controllo, ma non gira qui.
#
# Il controllo "2 su 3 partite con 60+ minuti" (input `screma`) NON filtra:
# marca i candidati che Sorare ha gia' selezionato. Costa 1 query a testa su
# qualche centinaio di nomi, un paio di minuti.
#
# La giornata si passa come numero (2, 3, ...) o come slug esatto, che ha la
# precedenza. Entrambi vuoti = prossima giornata aperta.

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: 'Numero di giornata (es. 2). Vuoto = prossima giornata aperta'
        required: false
        default: ''
        type: string
      fixture:
        description: 'Slug fixture esatto (es. football-4-7-aug-2026). Ha la precedenza sul numero'
        required: false
        default: ''
        type: string
      screma:
        description: 'Controllo 2-su-3 sulle ultime partite (1 query a giocatore, non filtra)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      gameweek: { required: false, default: '', type: string }
      fixture: { required: false, default: '', type: string }
      screma: { required: false, default: false, type: boolean }

permissions:
  contents: write

jobs:
  candidati:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install requests curl_cffi websocket-client

      # Il cookie serve: senza, searchPlayers viene respinta dai limiti di
      # complessita' dopo la prima pagina (misurato il 02/08). Il ritmo lo
      # governa il throttle condiviso di scanners/bot_profit.py -- barriera
      # globale sui 429, ritmo adattivo -- lo stesso che ha portato la
      # scrematura da "otto job, otto 429" a 301 giocatori/minuto senza errori.
      - name: Candidati della giornata
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ -n "${{ inputs.fixture }}" ]; then
            ARGS="--fixture ${{ inputs.fixture }}"
          elif [ -n "${{ inputs.gameweek }}" ]; then
            ARGS="--gameweek ${{ inputs.gameweek }}"
          fi
          if [ "${{ inputs.screma }}" = "true" ]; then
            ARGS="$ARGS --screen"
          fi
          python scouting_gw.py $ARGS

      # Artifact e non commit: si rigenera in sette secondi, e ogni file
      # nell'albero lo paga il checkout di OGNI job della pipeline.
      - uses: actions/upload-artifact@v4
        with:
          name: scouting-candidati
          path: dati_globali/scouting_*.json
          retention-days: 30
          if-no-files-found: error
