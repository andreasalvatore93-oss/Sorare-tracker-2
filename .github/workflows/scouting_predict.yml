name: Scouting + predict (acquisti)

# I candidati di una giornata futura, passati per il modello predittivo, con
# report HTML su Telegram. Serve a decidere COSA COMPRARE, non a schierare.
#
# Come funziona, in tre passi:
#   1. scouting_gw.py trova i candidati (searchPlayers, ~12 query, 7 secondi)
#      e scrive `formazione_<lega>/output/<lega>_<ruolo>_discovery/player_slugs.json`
#      -- che e' esattamente il file da cui i predict leggono la loro lista.
#      Nessun predict viene modificato.
#   2. i predict della lega girano su quella lista, un TARGET_SLUG per volta
#      (stesso schema della pipeline di produzione: budget di complessita' API
#      fresco a ogni giocatore).
#   3. i consigli alimentano la colonna "Atteso" del report HTML, che viene
#      committato su main e mandato su Telegram come link raw.githack.
#
# ATTENZIONE, e' il motivo per cui il default e' un campione piccolo: il passo 1
# SOVRASCRIVE la discovery di produzione delle leghe scelte. La prossima run di
# `formazione_giornata` la rigenera (e' il suo primo job), ma fino ad allora un
# run manuale dei predict userebbe questa lista invece delle carte possedute.
#
# Le starter odds NON servono: MIN_STARTER_ODDS e' a 0 dal 28/07, quindi il
# predict gira anche su chi non le ha ancora (che e' il caso normale quando si
# compra con giorni di anticipo).

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: 'Numero di giornata (es. 2). Vuoto = prossima giornata aperta'
        required: false
        default: ''
        type: string
      lega:
        description: 'Cartelle lega separate da virgola (es. mls oppure mls,messico)'
        required: false
        default: 'mls'
        type: string
      per_ruolo:
        description: 'Campione: quanti candidati per ruolo (i migliori per L10)'
        required: false
        default: '10'
        type: string
      screma:
        description: 'Controllo 2-su-3 sulle ultime partite (non filtra, marca soltanto)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scouting_predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install -r requirements-formazione.txt
      - run: pip install curl_cffi websocket-client

      - name: 1. Candidati e discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--lega ${{ inputs.lega }} --per-ruolo ${{ inputs.per_ruolo }} --scrivi-discovery"
          if [ -n "${{ inputs.gameweek }}" ]; then ARGS="$ARGS --gameweek ${{ inputs.gameweek }}"; fi
          if [ "${{ inputs.screma }}" = "true" ]; then ARGS="$ARGS --screen"; fi
          python scouting_gw.py $ARGS

      - name: 2. Predict sui candidati
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          for LEGA in $(echo "${{ inputs.lega }}" | tr ',' ' '); do
            for RUOLO in gk def mid fwd; do
              LISTA="formazione_$LEGA/output/${LEGA}_${RUOLO}_discovery/player_slugs.json"
              [ -f "$LISTA" ] || continue
              case "$RUOLO" in
                gk)  PY=test_gk.py ;;
                def) PY=test_def.py ;;
                mid) PY=test_mid.py ;;
                fwd) PY=test_mls_fwd_all.py ;;
              esac
              [ -f "formazione_$LEGA/predict/$PY" ] || { echo "manca formazione_$LEGA/predict/$PY, salto"; continue; }
              # Un giocatore per processo, come in produzione: il tetto di
              # complessita' dell'API si azzera a ogni avvio.
              for SLUG in $(python -c "import json,sys;print(' '.join(json.load(open(sys.argv[1]))))" "$LISTA"); do
                echo "--- $LEGA/$RUOLO/$SLUG"
                TARGET_SLUG="$SLUG" python "formazione_$LEGA/predict/$PY" || echo "predict fallito per $SLUG"
              done
            done
          done
          set -e

      - name: 3. Consigli
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          for LEGA in $(echo "${{ inputs.lega }}" | tr ',' ' '); do
            for RUOLO in gk def mid fwd; do
              case "$RUOLO" in
                gk)  CO=build_consiglio_gk.py ;;
                def) CO=build_consiglio_def.py ;;
                mid) CO=build_consiglio_mid.py ;;
                fwd) CO=build_consiglio.py ;;
              esac
              [ -f "formazione_$LEGA/consiglio/$CO" ] || continue
              python "formazione_$LEGA/consiglio/$CO" || echo "consiglio non generato per $LEGA/$RUOLO"
            done
          done
          set -e

      # Rigenerato DOPO i consigli: e' il passaggio che riempie la colonna
      # "Atteso". Prima dei consigli quella colonna sarebbe vuota.
      - name: 4. Report HTML
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--lega ${{ inputs.lega }} --per-ruolo ${{ inputs.per_ruolo }}"
          if [ -n "${{ inputs.gameweek }}" ]; then ARGS="$ARGS --gameweek ${{ inputs.gameweek }}"; fi
          python scouting_gw.py $ARGS --html generatore_formazioni/output/scouting_ultimo.html

      # Il link Telegram punta a raw.githack, che serve il file da GitHub: deve
      # essere gia' su main quando parte la notifica.
      - name: 5. Commit del report
        run: |
          git config user.name  "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add generatore_formazioni/output/scouting_ultimo.html
          git commit -m "Scouting: report candidati ${{ inputs.lega }}" || echo "niente da committare"
          git pull --rebase --autostash origin main || true
          git push origin main

      - name: 6. Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scouting_telegram_notify.py
