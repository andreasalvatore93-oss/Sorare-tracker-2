name: Bot Profit (tracking, no play)
on:
  workflow_dispatch:
    inputs:
      listen_seconds:
        description: "Secondi di ascolto"
        required: false
        default: "6000"
      commit_chunk_seconds:
        description: "Ogni quanti secondi riscrive e committa il CSV con tutte le carte tracciate finora"
        required: false
        default: "300"
      check_classic:
        description: "Traccia anche gli annunci CLASSIC oltre a in season (un solo file di output, in_season e classic mescolati, distinti dalla colonna tipo_carta)"
        required: false
        default: "si"
      transactions_window_days:
        description: "Finestra in GIORNI per la media transazioni (trim min/max) -- non piu' un campione fisso"
        required: false
        default: "7"
      max_tracked_cards:
        description: "Numero massimo di carte tracciate prima dello stop automatico del bot"
        required: false
        default: "500"
      top_n_output:
        description: "Quante carte mostrare nel CSV finale (le prime N per minimo attuale decrescente)"
        required: false
        default: "50"
      min_transactions_for_ranking:
        description: "Sotto questo numero di transazioni nella finestra, la carta e' esclusa dalla classifica (dato troppo rumoroso)"
        required: false
        default: "15"
      min_price_eur_threshold:
        description: "Sotto questo prezzo minimo, la carta e' scartata subito (nessun tracciamento, nessuna blacklist)"
        required: false
        default: "1.0"
      git_ref:
        description: "Branch/ref da eseguire e su cui committare (default main -- usare il proprio branch solo per test)"
        required: false
        default: "main"
      snapshot_mode:
        description: "'si' = modalita' SNAPSHOT: nessun listener websocket, giro esplicito sul roster delle squadre in team_whitelist (ricalcola SEMPRE ogni carta, in_season+classic). 'no' = comportamento normale a eventi."
        required: false
        default: "si"
      team_whitelist:
        description: "Modalita' snapshot: slug squadre MLS separati da virgola (lega mlspa). Vuoto = errore se snapshot_mode=si."
        required: false
        default: "nashville-sc,inter-miami,chicago-fire-bridgeview-illinois,new-england-foxborough-massachusetts,cincinnati-cincinnati-ohio,new-york-city-new-york-new-york,charlotte-fc-charlotte-north-carolina,new-york-rb-secaucus-new-jersey,dc-united-washington-district-of-columbia,orlando-city-lake-mary-florida,columbus-crew-columbus-ohio,toronto-toronto,montreal-impact-montreal-quebec,atlanta-united-atlanta-georgia,philadelphia-union-chester-pennsylvania,vancouver-whitecaps-vancouver-british-columbia,sj-earthquakes-santa-clara-california,los-angeles-fc-los-angeles-california,real-salt-lake-salt-lake-city-utah,dallas-frisco-texas,seattle-sounders-renton-washington,houston-dynamo-houston-texas,st-louis-city-st-louis-missouri,minnesota-united-minneapolis-saint-paul-minnesota,la-galaxy-los-angeles-california,colorado-rapids-denver-colorado,portland-timbers-portland-oregon,san-diego-san-diego,austin-austin-texas,sporting-kc-kansas-city-kansas"
      kleague_team_whitelist:
        description: "Modalita' snapshot: slug squadre K-League separati da virgola (lega k-league-1), processate INSIEME a team_whitelist nella stessa run con classifica separata"
        required: false
        default: "anyang-anyang,bucheon-1995-bucheon,daejeon-citizen-daejeon,gangwon-gangneung,gwangju-gwangju,incheon-united-incheon,jeju-united-seogwipo-jeju-do,jeonbuk-motors-jeonju,pohang-steelers-pohang,sangju-sangmu-sangju,seoul-seoul,ulsan-ulsan"
      eredivisie_team_whitelist:
        description: "Modalita' snapshot: slug squadre Eredivisie separati da virgola (lega eredivisie), classifica MESCOLATA con belgio_team_whitelist (1 solo file)"
        required: false
        default: "ado-den-haag-den-haag,az-alkmaar,ajax-amsterdam,cambuur-leeuwarden,excelsior-rotterdam,feyenoord-rotterdam,fortuna-sittard-sittard,go-ahead-eagles-deventer,groningen-groningen,heerenveen-heerenveen-1920,nec-nijmegen,pec-zwolle-zwolle,psv-eindhoven,sparta-rotterdam-rotterdam,telstar-velsen-zuid,twente-enschede,utrecht-utrecht,willem-ii-tilburg"
      belgio_team_whitelist:
        description: "Modalita' snapshot: slug squadre Jupiler Pro League (Belgio) separati da virgola, classifica MESCOLATA con eredivisie_team_whitelist (1 solo file)"
        required: false
        default: "anderlecht-bruxelles-brussel,antwerp-deurne,cercle-brugge-brugge,club-brugge-brugge,genk-genk,gent-gent,kortrijk-kortrijk,la-louviere-la-louviere,lommel-lommel,mechelen-mechelen-malines,oh-leuven-heverlee,sint-truiden-sint-truiden-st-trond,sporting-charleroi-charleroi,standard-liege-liege-luik,union-saint-gilloise-bruxelles-brussels,waasland-beveren-beveren-waas,westerlo-westerlo,zulte-waregem-waregem"
      snapshot_worker_threads:
        description: "Modalita' snapshot: quanti giocatori processare in parallelo (il rate limit verso Sorare resta comunque governato da _graphql_throttle, condiviso tra i worker)"
        required: false
        default: "10"
permissions:
  contents: write
concurrency:
  group: bot-profit
  cancel-in-progress: false
jobs:
  bot-profit:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests websocket-client curl_cffi
      - name: Run Bot Profit
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_VERSION: ${{ secrets.SORARE_VERSION }}
          SORARE_BUILD: ${{ secrets.SORARE_BUILD }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
          LISTEN_SECONDS: ${{ github.event.inputs.listen_seconds || '6000' }}
          COMMIT_CHUNK_SECONDS: ${{ github.event.inputs.commit_chunk_seconds || '300' }}
          CHECK_CLASSIC: ${{ github.event.inputs.check_classic || 'si' }}
          TRANSACTIONS_WINDOW_DAYS: ${{ github.event.inputs.transactions_window_days || '7' }}
          MAX_TRACKED_CARDS: ${{ github.event.inputs.max_tracked_cards || '500' }}
          TOP_N_OUTPUT: ${{ github.event.inputs.top_n_output || '50' }}
          MIN_TRANSACTIONS_FOR_RANKING: ${{ github.event.inputs.min_transactions_for_ranking || '15' }}
          MIN_PRICE_EUR_THRESHOLD: ${{ github.event.inputs.min_price_eur_threshold || '1.0' }}
          SNAPSHOT_MODE: ${{ github.event.inputs.snapshot_mode || 'si' }}
          TEAM_WHITELIST: ${{ github.event.inputs.team_whitelist || 'nashville-sc,inter-miami,chicago-fire-bridgeview-illinois,new-england-foxborough-massachusetts,cincinnati-cincinnati-ohio,new-york-city-new-york-new-york,charlotte-fc-charlotte-north-carolina,new-york-rb-secaucus-new-jersey,dc-united-washington-district-of-columbia,orlando-city-lake-mary-florida,columbus-crew-columbus-ohio,toronto-toronto,montreal-impact-montreal-quebec,atlanta-united-atlanta-georgia,philadelphia-union-chester-pennsylvania,vancouver-whitecaps-vancouver-british-columbia,sj-earthquakes-santa-clara-california,los-angeles-fc-los-angeles-california,real-salt-lake-salt-lake-city-utah,dallas-frisco-texas,seattle-sounders-renton-washington,houston-dynamo-houston-texas,st-louis-city-st-louis-missouri,minnesota-united-minneapolis-saint-paul-minnesota,la-galaxy-los-angeles-california,colorado-rapids-denver-colorado,portland-timbers-portland-oregon,san-diego-san-diego,austin-austin-texas,sporting-kc-kansas-city-kansas' }}
          KLEAGUE_TEAM_WHITELIST: ${{ github.event.inputs.kleague_team_whitelist || 'anyang-anyang,bucheon-1995-bucheon,daejeon-citizen-daejeon,gangwon-gangneung,gwangju-gwangju,incheon-united-incheon,jeju-united-seogwipo-jeju-do,jeonbuk-motors-jeonju,pohang-steelers-pohang,sangju-sangmu-sangju,seoul-seoul,ulsan-ulsan' }}
          EREDIVISIE_TEAM_WHITELIST: ${{ github.event.inputs.eredivisie_team_whitelist || 'ado-den-haag-den-haag,az-alkmaar,ajax-amsterdam,cambuur-leeuwarden,excelsior-rotterdam,feyenoord-rotterdam,fortuna-sittard-sittard,go-ahead-eagles-deventer,groningen-groningen,heerenveen-heerenveen-1920,nec-nijmegen,pec-zwolle-zwolle,psv-eindhoven,sparta-rotterdam-rotterdam,telstar-velsen-zuid,twente-enschede,utrecht-utrecht,willem-ii-tilburg' }}
          BELGIO_TEAM_WHITELIST: ${{ github.event.inputs.belgio_team_whitelist || 'anderlecht-bruxelles-brussel,antwerp-deurne,cercle-brugge-brugge,club-brugge-brugge,genk-genk,gent-gent,kortrijk-kortrijk,la-louviere-la-louviere,lommel-lommel,mechelen-mechelen-malines,oh-leuven-heverlee,sint-truiden-sint-truiden-st-trond,sporting-charleroi-charleroi,standard-liege-liege-luik,union-saint-gilloise-bruxelles-brussels,waasland-beveren-beveren-waas,westerlo-westerlo,zulte-waregem-waregem' }}
          SNAPSHOT_WORKER_THREADS: ${{ github.event.inputs.snapshot_worker_threads || '10' }}
        run: python scanners/bot_profit.py
      - name: Notifica Telegram con link ai CSV per gruppo
        if: always()
        env:
          # Stesso canale Telegram gia' usato da manager_bundle_scan.py/my_cards_profit.py
          # (secrets.BUNDLE_TELEGRAM_TOKEN/_CHAT_ID -> env TELEGRAM_TOKEN/TELEGRAM_CHAT_ID).
          TELEGRAM_TOKEN: ${{ secrets.BUNDLE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BUNDLE_TELEGRAM_CHAT_ID }}
          GIT_REF: ${{ github.event.inputs.git_ref || 'main' }}
        run: python scanners/bot_profit_telegram_notify.py
      - name: Commit CSV (globale + per campionato) + blacklist dedicata (fallback, se il commit periodico non ha gia' salvato tutto)
        if: always()
        run: |
          FILES="bot_profit_output sorare_lista_nera_profit.txt"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Nessuna modifica, niente da committare."
          else
            git config user.name "bot-profit"
            git config user.email "bot-profit@users.noreply.github.com"
            git add $FILES
            git commit -m "Bot Profit: commit finale dati tracciati (1 file globale + per campionato) + blacklist"
            git pull --rebase --autostash origin "${{ github.event.inputs.git_ref || 'main' }}"
            git push
          fi
