name: Verifica club Bundesliga

# Interroga dal vivo gli slug ufficiali dei club Bundesliga (Germania), sola
# lettura, per costruire germania_<ruolo>_discovery_global.py senza
# indovinare gli slug (29/07, backlog discovery_global big5).

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          PYTHONUNBUFFERED: "1"
        run: python diagnostics/verify_bundesliga_clubs.py
