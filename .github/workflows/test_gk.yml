name: Test Portieri MLS + Grid Search (prototipo)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-gk-prediction
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      player_slugs: ${{ steps.run_discovery.outputs.player_slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests curl_cffi

      - name: Esegui discovery portieri MLS in_season
        id: run_discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: python mls_gk_discovery.py

      - name: Commit output discovery
        if: always()
        run: |
          git config user.name "mls-gk-bot"
          git config user.email "mls-gk-bot@users.noreply.github.com"
          git add mls_gk_discovery/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "MLS Goalkeeper Discovery: nuovo run (pre-predict)"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."

  predict:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        player_slug: ${{ fromJson(needs.discover.outputs.player_slugs) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests curl_cffi

      - name: Run single-player prediction + grid search (job matrix, budget fresco per ognuno)
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          PYTHONUNBUFFERED: "1"
        run: python test_gk.py

      - name: Commit output e cache
        if: always()
        run: |
          git config user.name "mls-gk-bot"
          git config user.email "mls-gk-bot@users.noreply.github.com"
          git add mls_gk_all/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Test Portieri: predizione + grid search ${{ matrix.player_slug }}"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."

  merge:
    needs: [discover, predict]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Genera SOLO il riepilogo finale compatto (consiglio portieri)
        run: python build_consiglio_gk.py

      - name: Commit riepilogo
        run: |
          git config user.name "mls-gk-bot"
          git config user.email "mls-gk-bot@users.noreply.github.com"
          git add mls_gk_all/consiglio_*.txt
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Test Portieri: consiglio portieri"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
