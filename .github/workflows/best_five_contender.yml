name: Best Five Contender (multi-lega)

# Orchestratore per il backlog "Contender limitato a N leghe" (31/07,
# richiesta esplicita utente: "questa cosa andrebbe automatizzata da sempre,
# in futuro dovro' aggiungere un altro piccolo campionato"). Un solo
# workflow_dispatch fa TUTTO:
#   1) lancia best_five.yml (reusable, via workflow_call) UNA VOLTA PER LEGA
#      elencata in 'leghe', in parallelo (stesso identico motore delle run
#      singole gia' usate per MLS/K League/Austria/Croazia/2.Bundesliga --
#      zero duplicazione, vedi 'workflow_call' in best_five.yml).
#   2) a tutte finite, esegue il merge (python best_five.py contender
#      --leghe ..., nessuna query aggiuntiva -- legge solo i consiglio_*.txt
#      piu' freschi di ciascuna lega) e pubblica il report su
#      formazione_contender/output/best_five/.
#
# Per aggiungere una lega a Contender in futuro: basta includerla nel default
# di 'leghe' qui sotto (deve avere gia' discovery_global + un run Best Five
# completato almeno una volta) -- nessun'altra modifica al workflow.

on:
  workflow_dispatch:
    inputs:
      leghe:
        description: 'Nomi cartella, separati da virgola (spazi tollerati). Con discovery_global pronta oggi: austria, croazia, germania2 (esclusa se non gioca quella settimana), scozia, portogallo, danimarca, argentina -- norvegia in backlog, mai tracciata'
        required: false
        default: 'austria,croazia,germania2'
      backups:
        description: 'Numero di backup per ruolo (sia per le run singole sia per il merge)'
        required: false
        default: '2'
      starter_odds:
        description: 'Soglia starterOdds prefiltro (0-1), passata a ciascuna run singola'
        required: false
        default: '0.80'
      top_k_qualita:
        description: 'Cap per qualita PRIMA delle starterOdds, passato a ciascuna run singola'
        required: false
        default: '40'
      genera_cheapest:
        description: '"true" per generare ANCHE le 3 formazioni Contender piu economiche (stesso significato di best_five.yml)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build_matrix:
    runs-on: ubuntu-latest
    outputs:
      leghe_json: ${{ steps.set.outputs.leghe_json }}
    steps:
      - id: set
        env:
          LEGHE_RAW: ${{ inputs.leghe }}
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, os
          leghe = [s.strip() for s in os.environ.get('LEGHE_RAW', '').split(',') if s.strip()]
          print("leghe_json=" + json.dumps(leghe))
          PYEOF

  best_five_per_lega:
    needs: build_matrix
    strategy:
      fail-fast: false
      # 31/07: ridotto da 5 a 2 -- con tutte le leghe in parallelo, ognuna fa
      # le SUE query di prezzo di mercato (fetch_prezzi) sull'API Sorare nello
      # stesso momento, aumentando i 429/backoff e facendo scadere il timeout
      # dello step 'report' (successo lentissimo, poi cancellato manualmente
      # sulla run mista a 5 leghe). Con max-parallel basso: meno pressione
      # simultanea sull'API, e le leghe del secondo batch beneficiano della
      # cache prezzi gia' scritta (e committata) dal primo batch nella STESSA
      # run -- prima non succedeva perche' i job paralleli partono tutti dallo
      # stesso checkout iniziale e non si vedono a vicenda.
      max-parallel: 2
      matrix:
        lega: ${{ fromJson(needs.build_matrix.outputs.leghe_json) }}
    uses: ./.github/workflows/best_five.yml
    with:
      lega: ${{ matrix.lega }}
      roles: 'gk,def,mid,fwd'
      backups: ${{ inputs.backups }}
      starter_odds: ${{ inputs.starter_odds }}
      top_k_qualita: ${{ inputs.top_k_qualita }}
      # notify=false (31/07, richiesta esplicita utente): le run singole per
      # lega sono un passaggio INTERNO dell'orchestrazione, l'utente vuole
      # una sola notifica -- quella del merge finale, sotto.
      notify: 'false'
    secrets: inherit

  merge_contender:
    needs: best_five_per_lega
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # NECESSARIO (stesso motivo di best_five.yml): best_five.py importa
      # curl_cffi/requests a livello di modulo anche se questo step non fa
      # nessuna chiamata di rete (solo lettura dei consiglio_*.txt gia' su disco).
      # websocket-client: fetch_prezzi importa scanners/bot_profit.py, che
      # importa 'websocket' a livello di modulo (mai usato qui, solo per
      # l'ascolto live) -- senza il pacchetto l'IMPORT fallisce comunque.
      - run: pip install requests curl_cffi websocket-client
      - name: Costruisci Best Five Contender (merge + query prezzo mercato)
        env:
          # NUOVO (31/07): il merge ora fetcha ANCHE il prezzo minimo di
          # mercato in_season/classic per ogni giocatore mostrato -- vedi
          # commento nello stesso punto di best_five.yml.
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          BEST_FIVE_GENERA_CHEAPEST: ${{ inputs.genera_cheapest || 'true' }}
        run: python best_five.py contender --leghe "${{ inputs.leghe }}" --backups "${{ inputs.backups }}"
      - name: Salva risultati (retry su push)
        run: |
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add formazione_contender/output/best_five best_five_prezzi_cache.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Best Five Contender: risultati run $(date -u '+%Y-%m-%d %H:%M UTC')"
          attempt=0
          until git push origin main; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 5 ]; then
              echo "Impossibile salvare dopo 5 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            if git merge --no-edit origin/main; then
              continue
            fi
            # Stesso motivo di best_five.yml: conflitto atteso solo sulla
            # cache prezzi condivisa (mai -X ours, unione a livello JSON).
            CONFLITTI=$(git diff --name-only --diff-filter=U)
            if [ "$CONFLITTI" = "best_five_prezzi_cache.json" ]; then
              python3 merge_prezzi_cache.py best_five_prezzi_cache.json
              git add best_five_prezzi_cache.json
              git commit --no-edit
            else
              echo "Conflitto su file inattesi ($CONFLITTI), fallback -X ours."
              git merge --abort
              git merge --no-edit -X ours origin/main
            fi
          done
      - name: Notifica Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.BUNDLE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BUNDLE_TELEGRAM_CHAT_ID }}
          GIT_REF: main
          LEGA: contender
        run: python best_five_telegram_notify.py
