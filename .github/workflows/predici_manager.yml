name: Predici Manager (smart money — cache batch)

# Popola la cache del modello (detail_cache = game log passato) per una lista
# di giocatori non posseduti, schierati da altri manager in una GW chiusa
# (filone "smart money", HANDOFF_UNIFICATO §7). L'asset e' la cache: una volta
# scritta, il walk-forward as-of di qualunque GW passata e' locale a costo zero.
# Solo lancio manuale.

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "JSON {slug:{ruolo,dir,lega}} da predire (relativo al repo)"
        required: true
        default: "dati_globali/smart_money/miss_gw1.json"
      commit_every:
        description: "Committa la cache ogni N giocatori nuovi"
        required: false
        default: "10"
      timeout_singolo:
        description: "Timeout in secondi per singolo predict"
        required: false
        default: "240"
      force:
        description: "'si' per ri-predire anche i gamelog gia' esistenti (APPENDE le partite nuove: serve per rinfrescare cache stantie a una GW appena chiusa)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: predici-manager
  cancel-in-progress: false

jobs:
  predici:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Predici e cacha
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "si" ]; then FORCE="--force"; fi
          python predici_manager_batch.py \
            --input "${{ github.event.inputs.input_file }}" \
            --commit-every "${{ github.event.inputs.commit_every }}" \
            --timeout "${{ github.event.inputs.timeout_singolo }}" \
            $FORCE

      - name: Push cache
        if: always()
        run: |
          # Push robusto ai push concorrenti (Cerbero bot, altre sessioni): se
          # il remote e' avanzato, rebasa i commit di cache locali e ritenta,
          # altrimenti la cache appena raccolta andrebbe persa in silenzio.
          for i in 1 2 3 4 5; do
            git push origin main && exit 0
            echo "push #$i rifiutato, rebase e ritento..."
            git pull --rebase origin main || git rebase --abort
            sleep 5
          done
          echo "ATTENZIONE: push cache FALLITO dopo 5 tentativi"
