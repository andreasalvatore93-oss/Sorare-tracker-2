name: Formazione giornata (prototipo single-job)

# Prototipo redesign (29/07, branch redesign-async-pipeline): UN SOLO job
# invece della matrice (24 discovery + ~110 predict + ~110 consiglio).
# Riusa IDENTICA la logica esistente via run_pipeline_single_job.py --
# vedi docs/REDESIGN_PIPELINE_ASYNC.md per il disegno completo.
#
# Scope di test: SOLO MLS+K League, In Season 6+6 (stesso scope della run
# di riferimento gia' misurata: 11m48s, run 30466518933).

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: 'Numero giornata Sorare'
        required: false
        default: '96'
      starter_odds_min:
        description: 'Soglia starter-odds (0-1)'
        required: false
        default: '0'
      in_season:
        description: 'In Season per lega (es. mls:6,kleague:6)'
        required: false
        default: 'mls:6,kleague:6'
      max_workers:
        description: 'Sottoprocessi predict concorrenti'
        required: false
        default: '12'
      only_dirnames:
        description: 'Limita la discovery a queste leghe (es. mls,kleague). VUOTO se serve anche solo una All Stars.'
        required: false
        default: 'mls,kleague'

permissions:
  contents: write

jobs:
  run_single_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: redesign-async-pipeline }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install requests curl_cffi
      - name: Esegui pipeline in un solo processo
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          GAMEWEEK: ${{ github.event.inputs.gameweek }}
          MIN_STARTER_ODDS: ${{ github.event.inputs.starter_odds_min }}
          IN_SEASON: ${{ github.event.inputs.in_season }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers }}
          ONLY_DIRNAMES: ${{ github.event.inputs.only_dirnames }}
          PYTHONUNBUFFERED: "1"
        run: python run_pipeline_single_job.py
      - name: Commit risultati (UN SOLO commit, nessuna contesa possibile)
        if: always()
        run: |
          git config user.name "prototipo-singlejob-bot"
          git config user.email "prototipo-singlejob-bot@users.noreply.github.com"
          git add formazione_mls/output/ formazione_kleague/output/ generatore_formazioni/output/ || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Prototipo single-job: formazioni generate (test velocita')"
          git push
