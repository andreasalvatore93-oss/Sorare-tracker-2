name: Grid Search Aggregate (risultato calibrazione allargata)

# Legge tutti i file grid_search/*_grid.json accumulati finora (da uno o
# piu' batch di grid_search_calibrazione.yml) per il ruolo scelto, e
# calcola la combinazione di parametri che generalizza meglio ATTRAVERSO
# TUTTI i giocatori. Puo' essere rilanciato in qualsiasi momento, anche con
# batch parziali (l'aggregazione richiede solo che una combinazione sia
# presente per almeno meta' dei giocatori visti finora per essere
# considerata, altrimenti viene scartata come non abbastanza rappresentativa).

on:
  workflow_dispatch:
    inputs:
      ruolo:
        description: 'Ruolo da aggregare'
        required: true
        type: choice
        options: [gk, def, mid, fwd]

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aggrega risultati grid search (${{ github.event.inputs.ruolo }})
        env:
          RUOLO: ${{ github.event.inputs.ruolo }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_mls/calibrazione/aggregate_grid_search.py

      - name: Commit combinazione vincente aggregata
        if: always()
        run: |
          git config user.name "grid-search-aggregate-bot"
          git config user.email "grid-search-aggregate-bot@users.noreply.github.com"
          git add formazione_mls/output/mls_${{ github.event.inputs.ruolo }}_calibration/combinazione_vincente_aggregata.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Grid Search Aggregate (${{ github.event.inputs.ruolo }}): aggiornata combinazione vincente"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 8 ]; then
              echo "Impossibile salvare dopo 8 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
