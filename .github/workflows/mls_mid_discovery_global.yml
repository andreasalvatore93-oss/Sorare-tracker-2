name: MLS Midfielder Discovery GLOBALE (tutte le squadre, non solo posseduti)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mls-mid-discovery-global
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests curl_cffi

      - name: Esegui discovery globale centrocampisti MLS
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: python mls_mid_discovery_global.py

      - name: Commit output
        if: always()
        run: |
          git config user.name "mls-mid-discovery-global-bot"
          git config user.email "mls-mid-discovery-global-bot@users.noreply.github.com"
          git add mls_mid_discovery_global/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "MLS Midfielder Discovery GLOBALE: nuovo run"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 8 ]; then
              echo "Impossibile salvare dopo 8 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
