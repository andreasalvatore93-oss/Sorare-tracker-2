name: Discovery Campionati Mancanti (diagnostics, ricognizione)

# Script standalone di ricognizione (diagnostics/discover_missing_leagues.py):
# scansiona TUTTE le carte football possedute dall'utente su Sorare, aggrega
# per campionato ed esclude quelli gia' coperti da una pipeline dedicata, per
# scoprire quali altri campionati l'utente possiede in quantita' significativa.
# Nessun trigger automatico: solo workflow_dispatch, come le altre discovery.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-missing-leagues
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests curl_cffi

      - name: Discovery campionati mancanti
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: python diagnostics/discover_missing_leagues.py

      - name: Commit output discovery
        if: always()
        run: |
          git config user.name "diagnostics-bot"
          git config user.email "diagnostics-bot@users.noreply.github.com"
          git add diagnostics/output/missing_leagues_report.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Discovery campionati mancanti: nuovo report"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
