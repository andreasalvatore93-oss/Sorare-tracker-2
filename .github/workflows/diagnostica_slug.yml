name: Diagnostica slug

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Slug giocatori separati da virgola (es. inaki-pena)'
        required: false
        default: 'inaki-pena'
      card_slug:
        description: 'Slug carta per il probe bonus (es. daniel-de-sousa-brito-2026-limited-181)'
        required: false
        default: ''

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SLUGS: ${{ github.event.inputs.slugs }}
          CARD_SLUG: ${{ github.event.inputs.card_slug }}
          PYTHONUNBUFFERED: "1"
        run: python diagnostica_slug.py
