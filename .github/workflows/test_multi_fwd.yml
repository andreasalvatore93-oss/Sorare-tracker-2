name: Test Multi Attaccanti Prediction (prototipo)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-multi-fwd-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        player_slug:
          - prince-osei-owusu
          - anders-dreyer
          - zavier-gozo
          - ahoueke-denkey
          - heung-min-son
          - jesus-ferreira
          - kristoffer-velde

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests curl_cffi

      - name: Run single-player prediction (job matrix, budget di complessita' API fresco per ognuno)
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          PYTHONUNBUFFERED: "1"
        run: python test_multi_fwd.py

      - name: Commit output e cache
        if: always()
        run: |
          git config user.name "test-multi-fwd-bot"
          git config user.email "test-multi-fwd-bot@users.noreply.github.com"
          git add test_multi_fwd/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Test Multi Attaccanti: predizione ${{ matrix.player_slug }}"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 8 ]; then
              echo "Impossibile salvare dopo 8 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."

  merge:
    needs: predict
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Unisci tutti i file prediction_*.txt di questo run in un unico output
        run: |
          set -e
          RUN_TS="$(date -u '+%Y-%m-%d_%H%M%S')"
          MERGED_FILE="test_multi_fwd/merged_prediction_${RUN_TS}.txt"

          echo "======================================================================" > "$MERGED_FILE"
          echo "OUTPUT UNIFICATO - TEST MULTI-GIOCATORE (merge automatico)" >> "$MERGED_FILE"
          echo "Generato: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$MERGED_FILE"
          echo "======================================================================" >> "$MERGED_FILE"
          echo "" >> "$MERGED_FILE"

          # Prende, per ciascuno slug atteso, il file prediction_<slug>_*.txt piu' recente
          # (basato su ordinamento lessicografico del timestamp nel nome file) e lo accoda.
          for slug in prince-osei-owusu anders-dreyer zavier-gozo ahoueke-denkey heung-min-son jesus-ferreira kristoffer-velde; do
            latest=$(ls -1 test_multi_fwd/prediction_${slug}_*.txt 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$latest" ]; then
              echo "Trovato per $slug: $latest"
              cat "$latest" >> "$MERGED_FILE"
              echo "" >> "$MERGED_FILE"
            else
              echo "" >> "$MERGED_FILE"
              echo "### $slug: NESSUN OUTPUT TROVATO (job fallito o non ancora eseguito) ###" >> "$MERGED_FILE"
              echo "" >> "$MERGED_FILE"
            fi
          done

          echo "File unificato creato: $MERGED_FILE"
          wc -l "$MERGED_FILE"

      - name: Commit file unificato
        run: |
          git config user.name "test-multi-fwd-bot"
          git config user.email "test-multi-fwd-bot@users.noreply.github.com"
          git add test_multi_fwd/merged_prediction_*.txt
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Test Multi Attaccanti: output unificato"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 8 ]; then
              echo "Impossibile salvare dopo 8 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
