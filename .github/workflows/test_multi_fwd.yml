name: Test Multi Attaccanti Prediction (prototipo)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-multi-fwd-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        player_slug:
          - prince-osei-owusu
          - anders-dreyer
          - zavier-gozo
          - ahoueke-denkey
          - heung-min-son
          - jesus-ferreira
          - kristoffer-velde

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests curl_cffi

      - name: Run single-player prediction (job matrix, budget di complessita' API fresco per ognuno)
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          PYTHONUNBUFFERED: "1"
        run: python test_multi_fwd.py

      - name: Commit output e cache
        if: always()
        run: |
          git config user.name "test-multi-fwd-bot"
          git config user.email "test-multi-fwd-bot@users.noreply.github.com"
          git add test_multi_fwd/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Test Multi Attaccanti: predizione ${{ matrix.player_slug }}"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 8 ]; then
              echo "Impossibile salvare dopo 8 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
