name: Resto del Mondo Discovery (miei giocatori posseduti, per ruolo)

# Analogo a formazione_completa_kleague.yml (solo i job discover_*, senza
# predict/consiglio/formazione finale -- fuori scope di questo task): un job a
# matrice, uno per ruolo (GK/DEF/MID/FWD), ognuno scopre le carte Resto del Mondo
# possedute da 'crowss' (IN_SEASON + CLASSIC) e ne salva gli slug/counters.
# Nessun trigger automatico: solo workflow_dispatch, come le altre discovery.

on:
  workflow_dispatch:
    inputs:
      starter_odds_min:
        description: 'Soglia minima starter-odds (0-1) per includere un giocatore, es. 0.70. Dato mancante = tenuto per sicurezza.'
        required: false
        default: '0.60'

permissions:
  contents: write

concurrency:
  group: resto-mondo-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruolo: gk
            script: resto_mondo_gk_discovery.py
            output_dir: resto_mondo_gk_discovery
          - ruolo: def
            script: resto_mondo_def_discovery.py
            output_dir: resto_mondo_def_discovery
          - ruolo: mid
            script: resto_mondo_mid_discovery.py
            output_dir: resto_mondo_mid_discovery
          - ruolo: fwd
            script: resto_mondo_fwd_discovery.py
            output_dir: resto_mondo_fwd_discovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests curl_cffi

      - name: Discovery Resto del Mondo (${{ matrix.ruolo }})
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          MIN_STARTER_ODDS: ${{ github.event.inputs.starter_odds_min }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_resto_mondo/discovery/${{ matrix.script }}

      - name: Commit output discovery (${{ matrix.ruolo }})
        if: always()
        run: |
          git config user.name "resto-mondo-formazione-bot"
          git config user.email "resto-mondo-formazione-bot@users.noreply.github.com"
          git add formazione_resto_mondo/output/${{ matrix.output_dir }}/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Resto del Mondo Discovery: nuovo run (${{ matrix.ruolo }})"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
