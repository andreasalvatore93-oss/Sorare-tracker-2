name: MLS Discovery GLOBALE (tutti i ruoli, tutte le squadre, non solo posseduti)

# Sostituisce mls_mid_discovery_global.yml (solo centrocampisti): un job a
# matrice, uno per ruolo (GK/DEF/MID/FWD), ognuno scopre TUTTI i giocatori
# MLS in_season di quella posizione su tutte le 30 squadre (non solo i
# posseduti dall'utente) -- serve ad allargare il campione per un futuro
# grid search di calibrazione piu' ampio. NON usata per l'uso finale
# (schierare la formazione, che resta sui soli posseduti via le discovery
# per-utente in formazione_completa.yml).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mls-discovery-global
  cancel-in-progress: false

jobs:
  discover_global:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruolo: gk
            script: mls_gk_discovery_global.py
            output_dir: mls_gk_discovery_global
          - ruolo: def
            script: mls_def_discovery_global.py
            output_dir: mls_def_discovery_global
          - ruolo: mid
            script: mls_mid_discovery_global.py
            output_dir: mls_mid_discovery_global
          - ruolo: fwd
            script: mls_fwd_discovery_global.py
            output_dir: mls_fwd_discovery_global
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests curl_cffi

      - name: Esegui discovery globale (${{ matrix.ruolo }})
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: python formazione_mls/discovery/${{ matrix.script }}

      - name: Commit output (${{ matrix.ruolo }})
        if: always()
        run: |
          git config user.name "mls-discovery-global-bot"
          git config user.email "mls-discovery-global-bot@users.noreply.github.com"
          git add formazione_mls/output/${{ matrix.output_dir }}/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "MLS Discovery GLOBALE (${{ matrix.ruolo }}): nuovo run"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 8 ]; then
              echo "Impossibile salvare dopo 8 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
