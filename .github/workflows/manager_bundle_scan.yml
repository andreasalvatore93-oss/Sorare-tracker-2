name: Manager Bundle Offer Scanner

on:
  workflow_dispatch:
    inputs:
      manager_slug_or_url:
        description: "Slug del manager (es. 'satonio') oppure URL del suo profilo. Lascia VUOTO solo se usi l'auto-discovery qui sotto."
        required: false
      auto_find_manager:
        description: "Scrivi 'si' per l'auto-discovery: ascolta il mercato e trova da solo un manager con almeno 10 carte in season in vendita (usato SOLO se il campo manager sopra e' vuoto). Default 'si' -- disabilita con 'no' se vuoi solo exit senza input."
        required: false
        default: "si"
      blacklist_managers:
        description: "Aggiungi manager alla blacklist temporanea per questa run (lista di slug separati da virgola, es. 'satonio, zenlock, clem777'). Persiste per sempre nel codice se aggiunto qui e non rimosso."
        required: false
        default: ""
      auto_find_listen_seconds:
        description: "Solo per auto-discovery: secondi di ascolto del mercato prima di scegliere il manager"
        required: false
        default: "120"
      remove_cooldown_managers:
        description: "Anti-raffreddamento: slug (separati da virgola) da TOGLIERE subito dalla coda di raffreddamento 7gg dell'auto-discovery"
        required: false
        default: ""
      auto_find_cooldown_days:
        description: "Solo per auto-discovery: dopo quanti giorni un manager gia' scansionato torna scansionabile (non riguarda l'input manuale)"
        required: false
        default: "7"
      bundle_offer_margin_fraction:
        description: "Margine di sconto sul totale minimo di mercato per l'offerta suggerita (es. 0.25 = 25%, provvisorio da tarare)"
        required: false
        default: "0.25"
      max_owned_card_pages:
        description: "Tetto di sicurezza: numero massimo di pagine di carte possedute da scansionare"
        required: false
        default: "20"
      max_players_to_check:
        description: "Tetto di sicurezza: numero massimo di giocatori diversi da controllare sul mercato"
        required: false
        default: "300"
      bundle_block_size:
        description: "Numero di carte per blocco (limite Sorare per offerta cumulativa: max 10)"
        required: false
        default: "10"

permissions:
  contents: write

# Workflow manuale, uno-shot (nessun ascolto, nessuna cadenza cron esterna) -- a differenza dei
# tre tracker esistenti, gira finche' non termina l'analisi e basta. Concurrency comunque in
# coda (non cancel-in-progress) per lo stesso motivo degli altri workflow: se lanci due analisi
# quasi in contemporanea, la seconda aspetta che la prima finisca di salvare il log invece di
# rischiare un conflitto push.
concurrency:
  group: manager-bundle-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Stesso pattern di log-su-file-accodato gia' usato dai tre tracker esistenti (leggibile
      # dopo un pull, senza Chrome ne' copia-incolla).
      - name: Run manager bundle scan
        id: scan
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          MANAGER_SLUG_OR_URL: ${{ github.event.inputs.manager_slug_or_url }}
          AUTO_FIND_MANAGER: ${{ github.event.inputs.auto_find_manager || 'si' }}
          AUTO_FIND_LISTEN_SECONDS: ${{ github.event.inputs.auto_find_listen_seconds || '120' }}
          AUTO_FIND_COOLDOWN_DAYS: ${{ github.event.inputs.auto_find_cooldown_days || '7' }}
          REMOVE_COOLDOWN_MANAGERS: ${{ github.event.inputs.remove_cooldown_managers }}
          BLACKLIST_MANAGERS: ${{ github.event.inputs.blacklist_managers }}
          BUNDLE_OFFER_MARGIN_FRACTION: ${{ github.event.inputs.bundle_offer_margin_fraction || '0.25' }}
          MAX_OWNED_CARD_PAGES: ${{ github.event.inputs.max_owned_card_pages || '20' }}
          MAX_PLAYERS_TO_CHECK: ${{ github.event.inputs.max_players_to_check || '300' }}
          BUNDLE_BLOCK_SIZE: ${{ github.event.inputs.bundle_block_size || '10' }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p logs
          {
            echo ""
            echo "===== RUN $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
            python scanners/manager_bundle_scan.py
          } 2>&1 | tee -a scanners/logs/manager_bundle_scan_last_run.log
          # Rete di sicurezza SOLO per non far crescere il file all'infinito -- stesso pattern
          # gemello degli altri tre workflow, tiene le ultime 200 run intere.
          awk -v maxruns=200 '
            /^===== RUN / { runs++; starts[runs]=NR }
            { buf[NR]=$0; last=NR }
            END {
              from = (runs > maxruns) ? starts[runs-maxruns+1] : 1
              for (i=from; i<=last; i++) print buf[i]
            }
          ' scanners/logs/manager_bundle_scan_last_run.log > scanners/logs/manager_bundle_scan_last_run.log.tmp && mv scanners/logs/manager_bundle_scan_last_run.log.tmp scanners/logs/manager_bundle_scan_last_run.log
          # FIX 10/08 (richiesta esplicita dell'utente, report HTML al posto dei messaggi Telegram
          # a blocchi): il file HTML e' a percorso FISSO e sovrascritto ad ogni run, quindi la sua
          # sola presenza non basta a dire che questa run ha prodotto un risultato fresco (se
          # questa run non ha trovato carte, il file resta quello della run precedente). Lo script
          # stampa "REPORT_READY <slug> <n>" SOLO quando scrive davvero il file in questa run --
          # lo cerchiamo nel log appena prodotto per decidere se notificare.
          REPORT_LINE=$(grep '^REPORT_READY ' scanners/logs/manager_bundle_scan_last_run.log | tail -n 1 || true)
          if [ -n "$REPORT_LINE" ]; then
            echo "report_ready=true" >> "$GITHUB_OUTPUT"
            echo "manager_slug=$(echo "$REPORT_LINE" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          else
            echo "report_ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Nessun database da salvare qui (a differenza degli altri tre workflow): questo strumento
      # non ha stato persistente tra un'esecuzione e l'altra, ogni run e' autonomo. Salviamo il
      # log e il report HTML (percorso fisso, sovrascritto ad ogni run).
      - name: Save log and persist blacklist
        id: save
        if: always()
        run: |
          git config user.name "sorare-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f scanners/logs/manager_bundle_scan_last_run.log ]; then
            git add scanners/logs/manager_bundle_scan_last_run.log
          fi
          if [ -f scanners/logs/manager_bundle_scan_report.html ]; then
            git add scanners/logs/manager_bundle_scan_report.html
          fi
          # Se questa run ha aggiunto manager alla blacklist temporanea, salva nel file per sempre
          if [ -n "$BLACKLIST_MANAGERS" ]; then
            echo "# Aggiunti dal workflow in data $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> .github/auto_find_blacklist_additions.txt
            echo "$BLACKLIST_MANAGERS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sort -u >> .github/auto_find_blacklist_additions.txt
            git add .github/auto_find_blacklist_additions.txt
          fi
          # Salva il raffreddamento auto-discovery (quali manager sono stati scansionati e
          # quando) -- solo per la modalita' auto-discovery, l'input manuale non lo tocca.
          if [ -f .manager_bundle_scan_cooldown.json ]; then
            git add .manager_bundle_scan_cooldown.json
          fi
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "update manager bundle scan log $([ -n "$BLACKLIST_MANAGERS" ] && echo "e blacklist")"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 5 ]; then
              echo "Impossibile salvare dopo 5 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito (probabile esecuzione in parallelo), ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 8 + 3))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # FIX 10/08 (richiesta esplicita dell'utente): notifica Telegram minima con SOLO il link al
      # report HTML (non piu' il contenuto a blocchi) -- stesso pattern gia' collaudato in
      # best_five_telegram_notify.py, raw.githack.com fa RENDERE l'HTML al browser invece di
      # scaricarlo. Step SEPARATO e DOPO lo step che ha gia' pushato il file, cosi' il link punta
      # a un file davvero presente su GitHub quando arriva la notifica. Salta se questa run non ha
      # prodotto un report fresco (vedi report_ready sopra) o se i secret non sono configurati.
      #
      # FIX 10/08 (v2, bug reale osservato dall'utente: il link della seconda run puntava ancora
      # al report della PRIMA run, temha58 invece di yannic10): raw.githack.com e' una CDN che
      # CACHA aggressivamente gli URL basati su un branch (es. ".../main/...") -- il file su
      # GitHub era gia' aggiornato, ma il link continuava a servire la copia vecchia. Il file HTML
      # ha percorso FISSO e viene sovrascritto ad ogni run, quindi un URL "main" e' esattamente il
      # caso che la CDN cacha di piu'. Fix: puntare al COMMIT SHA appena creato (commit_sha, dallo
      # step precedente) invece che al branch -- e' un URL diverso ad ogni run, quindi non puo'
      # MAI essere una cache stantia di un run precedente.
      - name: Notify Telegram with report link
        if: steps.scan.outputs.report_ready == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.BUNDLE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BUNDLE_TELEGRAM_CHAT_ID }}
          MANAGER_SLUG: ${{ steps.scan.outputs.manager_slug }}
          COMMIT_SHA: ${{ steps.save.outputs.commit_sha }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "BUNDLE_TELEGRAM_TOKEN/BUNDLE_TELEGRAM_CHAT_ID non configurati, salto la notifica."
            exit 0
          fi
          if [ -z "$COMMIT_SHA" ]; then
            echo "commit_sha non disponibile (nessun commit nello step precedente?), salto la notifica."
            exit 0
          fi
          URL="https://raw.githack.com/${GITHUB_REPOSITORY}/${COMMIT_SHA}/scanners/logs/manager_bundle_scan_report.html"
          MSG="🎯 <b>${MANAGER_SLUG}</b> — report bundle pronto: <a href=\"${URL}\">apri</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            --data-urlencode text="${MSG}"
