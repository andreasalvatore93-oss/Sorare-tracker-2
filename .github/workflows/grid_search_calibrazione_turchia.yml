name: Turchia Grid Search Calibrazione (allargata, a batch)

# Equivalente Turchia di grid_search_calibrazione_kleague.yml: per un
# ruolo scelto, lancia prima la discovery POSSEDUTI Turchia (nessuno
# script "_discovery_global" esiste per questo campionato -- a differenza di
# MLS/K League, Turchia non ha mai avuto una discovery allargata oltre
# ai giocatori posseduti dall'utente, quindi il pool di calibrazione resta
# quello dei posseduti, verosimilmente piccolo), poi un job a matrice che
# rilancia test_<ruolo>.py in CALIBRATION_MODE per ogni giocatore del batch,
# salvando i risultati in
# formazione_turchia/output/turchia_<ruolo>_calibration/grid_search/.
#
# NOTA sull'input min_avg_score_quality: presente solo per compatibilita' di
# interfaccia col workflow K League (stesso comando di lancio) -- NON viene
# passato allo script di discovery posseduti (che non ha un filtro di
# qualita' equivalente), il pool resta quello standard posseduti/filtri di
# produzione della discovery esistente.
#
# GitHub Actions ha un limite di 256 job per matrice; per pool piu' ampi si
# puo' rilanciare cambiando batch_index. I risultati si ACCUMULANO nella
# cartella grid_search/. L'aggregazione si fa in locale con
# formazione_mls/calibrazione/aggregate_grid_search.py (CAMPIONATO=turchia).

on:
  workflow_dispatch:
    inputs:
      ruolo:
        description: 'Ruolo da calibrare'
        required: true
        type: choice
        options: [gk, def, mid, fwd]
      batch_index:
        description: 'Indice del batch (0-based). Ogni batch copre batch_size giocatori.'
        required: false
        default: '0'
      batch_size:
        description: 'Giocatori per batch (max 256 per il limite GitHub Actions sulla matrice)'
        required: false
        default: '200'
      min_avg_score_quality:
        description: 'Non usato per questo campionato (nessuna discovery globale) -- presente solo per compatibilita interfaccia'
        required: false
        default: '15'

permissions:
  contents: write

concurrency:
  group: grid-search-calibrazione-turchia-${{ github.event.inputs.ruolo }}
  cancel-in-progress: false

jobs:
  discover_batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      player_slugs: ${{ steps.slice.outputs.player_slugs }}
      batch_count: ${{ steps.slice.outputs.batch_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi

      - name: Discovery posseduti (Turchia, ${{ github.event.inputs.ruolo }})
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ github.event.inputs.ruolo }}" in
            gk) python formazione_turchia/discovery/turchia_gk_discovery.py ;;
            def) python formazione_turchia/discovery/turchia_def_discovery.py ;;
            mid) python formazione_turchia/discovery/turchia_mid_discovery.py ;;
            fwd) python formazione_turchia/discovery/turchia_fwd_discovery.py ;;
          esac

      - name: Commit output discovery aggiornato
        run: |
          git config user.name "grid-search-calibrazione-turchia-bot"
          git config user.email "grid-search-calibrazione-turchia-bot@users.noreply.github.com"
          git add formazione_turchia/output/turchia_${{ github.event.inputs.ruolo }}_discovery/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Turchia Grid Search Calibrazione (${{ github.event.inputs.ruolo }}): discovery aggiornata"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Estrai il batch richiesto (batch_index/batch_size, esclusi i gia' analizzati)
        id: slice
        run: |
          python3 - <<'EOF'
          import json, os

          ruolo = "${{ github.event.inputs.ruolo }}"
          batch_index = int("${{ github.event.inputs.batch_index || '0' }}")
          batch_size = int("${{ github.event.inputs.batch_size || '200' }}")

          path = f"formazione_turchia/output/turchia_{ruolo}_discovery/player_slugs.json"
          with open(path, encoding="utf-8") as f:
              slugs = json.load(f)

          # ESCLUDE i giocatori che hanno gia' un grid.json salvato da un giro
          # di calibrazione precedente -- utile per rilanciare la discovery
          # senza rifare query API/job CI su chi e' gia' stato processato.
          grid_dir = f"formazione_turchia/output/turchia_{ruolo}_calibration/grid_search"
          already_done = set()
          if os.path.isdir(grid_dir):
              already_done = {
                  fname[:-len("_grid.json")]
                  for fname in os.listdir(grid_dir) if fname.endswith("_grid.json")
              }
          new_slugs = [s for s in slugs if s not in already_done]

          start = batch_index * batch_size
          end = start + batch_size
          batch = new_slugs[start:end]

          batch_count = (len(new_slugs) + batch_size - 1) // batch_size

          print(f"Totale giocatori posseduti qualificati: {len(slugs)}")
          print(f"Gia' analizzati in precedenza (esclusi da questo giro): {len(slugs) - len(new_slugs)}")
          print(f"Da analizzare: {len(new_slugs)}")
          print(f"Batch {batch_index} (range [{start}:{end}]): {len(batch)} giocatori")
          print(f"Batch totali necessari per coprire i rimanenti: {batch_count}")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"player_slugs={json.dumps(batch)}\n")
              f.write(f"batch_count={batch_count}\n")
          EOF

  calibrate:
    needs: discover_batch
    if: needs.discover_batch.outputs.player_slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        player_slug: ${{ fromJson(needs.discover_batch.outputs.player_slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi

      - name: Grid search completo per ${{ matrix.player_slug }}
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          CALIBRATION_MODE: "si"
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ github.event.inputs.ruolo }}" in
            gk) python formazione_turchia/predict/test_gk.py ;;
            def) python formazione_turchia/predict/test_def.py ;;
            mid) python formazione_turchia/predict/test_mid.py ;;
            fwd) python formazione_turchia/predict/test_mls_fwd_all.py ;;
          esac

      - name: Commit risultati grid search (accumulo, non sovrascrive altri batch)
        if: always()
        run: |
          git config user.name "grid-search-calibrazione-turchia-bot"
          git config user.email "grid-search-calibrazione-turchia-bot@users.noreply.github.com"
          git add formazione_turchia/output/turchia_${{ github.event.inputs.ruolo }}_calibration/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Turchia Grid Search Calibrazione (${{ github.event.inputs.ruolo }}): ${{ matrix.player_slug }}"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
