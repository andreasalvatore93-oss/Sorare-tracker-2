  discovery_merge:
    needs: [discovery_gk_0, discovery_gk_1, discovery_gk_2, discovery_gk_3, discovery_gk_4, discovery_def_0, discovery_def_1, discovery_def_2, discovery_def_3, discovery_def_4, discovery_def_5, discovery_def_6, discovery_def_7, discovery_def_8, discovery_mid_0, discovery_mid_1, discovery_mid_2, discovery_mid_3, discovery_mid_4, discovery_mid_5, discovery_mid_6, discovery_mid_7, discovery_mid_8, discovery_fwd_0, discovery_fwd_1, discovery_fwd_2, discovery_fwd_3, discovery_fwd_4]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrice: ${{ steps.merge.outputs.matrice }}
      matrice_unique: ${{ steps.merge.outputs.matrice_unique }}
    env:
      MATRICE_0: ${{ needs.discovery_gk_0.outputs.matrice }}
      MATRICE_1: ${{ needs.discovery_gk_1.outputs.matrice }}
      MATRICE_2: ${{ needs.discovery_gk_2.outputs.matrice }}
      MATRICE_3: ${{ needs.discovery_gk_3.outputs.matrice }}
      MATRICE_4: ${{ needs.discovery_gk_4.outputs.matrice }}
      MATRICE_5: ${{ needs.discovery_def_0.outputs.matrice }}
      MATRICE_6: ${{ needs.discovery_def_1.outputs.matrice }}
      MATRICE_7: ${{ needs.discovery_def_2.outputs.matrice }}
      MATRICE_8: ${{ needs.discovery_def_3.outputs.matrice }}
      MATRICE_9: ${{ needs.discovery_def_4.outputs.matrice }}
      MATRICE_10: ${{ needs.discovery_def_5.outputs.matrice }}
      MATRICE_11: ${{ needs.discovery_def_6.outputs.matrice }}
      MATRICE_12: ${{ needs.discovery_def_7.outputs.matrice }}
      MATRICE_13: ${{ needs.discovery_def_8.outputs.matrice }}
      MATRICE_14: ${{ needs.discovery_mid_0.outputs.matrice }}
      MATRICE_15: ${{ needs.discovery_mid_1.outputs.matrice }}
      MATRICE_16: ${{ needs.discovery_mid_2.outputs.matrice }}
      MATRICE_17: ${{ needs.discovery_mid_3.outputs.matrice }}
      MATRICE_18: ${{ needs.discovery_mid_4.outputs.matrice }}
      MATRICE_19: ${{ needs.discovery_mid_5.outputs.matrice }}
      MATRICE_20: ${{ needs.discovery_mid_6.outputs.matrice }}
      MATRICE_21: ${{ needs.discovery_mid_7.outputs.matrice }}
      MATRICE_22: ${{ needs.discovery_mid_8.outputs.matrice }}
      MATRICE_23: ${{ needs.discovery_fwd_0.outputs.matrice }}
      MATRICE_24: ${{ needs.discovery_fwd_1.outputs.matrice }}
      MATRICE_25: ${{ needs.discovery_fwd_2.outputs.matrice }}
      MATRICE_26: ${{ needs.discovery_fwd_3.outputs.matrice }}
      MATRICE_27: ${{ needs.discovery_fwd_4.outputs.matrice }}
    steps:
      - id: merge
        run: |
          python3 -c "
          import json, os
          names = ['MATRICE_0', 'MATRICE_1', 'MATRICE_2', 'MATRICE_3', 'MATRICE_4', 'MATRICE_5', 'MATRICE_6', 'MATRICE_7', 'MATRICE_8', 'MATRICE_9', 'MATRICE_10', 'MATRICE_11', 'MATRICE_12', 'MATRICE_13', 'MATRICE_14', 'MATRICE_15', 'MATRICE_16', 'MATRICE_17', 'MATRICE_18', 'MATRICE_19', 'MATRICE_20', 'MATRICE_21', 'MATRICE_22', 'MATRICE_23', 'MATRICE_24', 'MATRICE_25', 'MATRICE_26', 'MATRICE_27']
          parts = [json.loads(os.environ.get(v) or '[]') for v in names]
          combined = [x for p in parts for x in p]
          print('matrice=' + json.dumps(combined, separators=(',', ':')))
          # matrice_unique (28/07, sharding predict): un'unica coppia
          # lega/ruolo per il job 'consiglio' a valle, senza il campo
          # 'shard' -- che nella matrice sharded (mls/kleague) compare
          # ripetuto N volte per la stessa coppia lega/ruolo.
          seen = []
          for x in combined:
              pair = {'league': x['league'], 'role': x['role']}
              if pair not in seen:
                  seen.append(pair)
          print('matrice_unique=' + json.dumps(seen, separators=(',', ':')))
          " >> "$GITHUB_OUTPUT"

  predict:
    needs: discovery_merge
    if: needs.discovery_merge.outputs.matrice != '' && needs.discovery_merge.outputs.matrice != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 77
      matrix:
        combo: ${{ fromJson(needs.discovery_merge.outputs.matrice) }}
    env:
      LEGA: ${{ matrix.combo.league }}
      RUOLO: ${{ matrix.combo.role }}
      SHARD: ${{ matrix.combo.shard }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - name: Predict
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          case "$RUOLO" in
            gk)  PY=test_gk.py ;;
            def) PY=test_def.py ;;
            mid) PY=test_mid.py ;;
            fwd) PY=test_mls_fwd_all.py ;;
          esac
          FILE="formazione_$LEGA/output/${LEGA}_${RUOLO}_discovery/player_slugs.json"
          # Sharding predict (28/07, leghe numerose mls/kleague, vedi
          # discovery_fixture.py): SHARD e' 'idx:n' (es. '1:4') se questa
          # combinazione lega/ruolo e' stata spezzata in piu' job paralleli,
          # vuoto altrimenti (comportamento INVARIATO, un solo job con TUTTI
          # gli slug). Split deterministico per indice (idx % n), stesso
          # criterio di DISCOVERY_LEAGUE_SHARD.
          SLUGS=$(python -c "
          import json, os
          slugs = json.load(open('$FILE'))
          shard = os.environ.get('SHARD', '').strip()
          if shard:
              idx, n = (int(x) for x in shard.split(':'))
              slugs = [s for i, s in enumerate(slugs) if i % n == idx]
          print(' '.join(slugs))
          ")
          echo "Giocatori da elaborare (shard '${SHARD:-nessuno}'): $SLUGS"
          for SLUG in $SLUGS; do
            echo "--- $LEGA/$RUOLO: $SLUG ---"
            TARGET_SLUG="$SLUG" python "formazione_$LEGA/predict/$PY" || echo "predict fallito per $SLUG"
          done
      - if: always()
        run: |
          git config user.name "generatore-formazioni-bot"
          git config user.email "generatore-formazioni-bot@users.noreply.github.com"
          git add "formazione_$LEGA/output/" || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Formazione giornata: $LEGA $RUOLO predict${SHARD:+ (quota $SHARD)}"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then exit 1; fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  # Aggregazione consiglio (28/07, sharding predict): il job 'predict' sopra
  # ora puo' spezzare una combinazione lega/ruolo in piu' shard paralleli
  # (mls/kleague), quindi il consiglio (che legge TUTTI i file
  # prediction_<slug>_*.txt di quel ruolo) va costruito UNA volta sola, dopo
  # che TUTTI gli shard sono completati -- da qui 'needs: predict' a livello
  # di job intero (aspetta l'intera matrice, non solo la propria combo).
  # Usa matrice_unique (una sola voce per coppia lega/ruolo, senza 'shard').
  consiglio:
    needs: [discovery_merge, predict]
    if: needs.discovery_merge.outputs.matrice != '' && needs.discovery_merge.outputs.matrice != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJson(needs.discovery_merge.outputs.matrice_unique) }}
    env:
      LEGA: ${{ matrix.combo.league }}
      RUOLO: ${{ matrix.combo.role }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Costruisci consiglio
        run: |
          set -u
          case "$RUOLO" in
            gk)  CO=build_consiglio_gk.py ;;
            def) CO=build_consiglio_def.py ;;
            mid) CO=build_consiglio_mid.py ;;
            fwd) CO=build_consiglio.py ;;
          esac
          python "formazione_$LEGA/consiglio/$CO" || echo "consiglio non generato"
      - if: always()
        run: |
          git config user.name "generatore-formazioni-bot"
          git config user.email "generatore-formazioni-bot@users.noreply.github.com"
          git add "formazione_$LEGA/output/" || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Formazione giornata: $LEGA $RUOLO consiglio"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then exit 1; fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done

  formazione:
    needs: [discovery_merge, predict, consiglio]
    # if: always() (28/07, bug reale) girava ANCHE quando la giornata non si
    # risolveva affatto (es. gameweek/fixture_slug mancanti o sbagliati):
    # tutti i job discovery fallivano, predict veniva giustamente saltato
    # (guardia sotto), ma questo job proseguiva comunque leggendo i CONSIGLI
    # VECCHI gia' committati da run precedenti -- generava e notificava su
    # Telegram una formazione "nuova" ma basata su dati stantii, senza alcun
    # errore visibile. Stessa guardia di 'predict': gira solo se la discovery
    # ha prodotto almeno una combinazione lega/ruolo, altrimenti salta tutto
    # (formazione E notifica) invece di proseguire silenziosamente sul vecchio.
    if: needs.discovery_merge.outputs.matrice != '' && needs.discovery_merge.outputs.matrice != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests curl_cffi
      - env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          IN_SEASON: ${{ github.event.inputs.in_season }}
          ARENA_DEDICATA: ${{ github.event.inputs.arena_dedicata }}
          ARENA_ALLSTARS_260: ${{ github.event.inputs.arena_allstars_260 }}
          ARENA_ALLSTARS_220: ${{ github.event.inputs.arena_allstars_220 }}
          ARENA_ALLSTARS_UNCAPPED: ${{ github.event.inputs.arena_allstars_uncapped }}
          ALLSTARS: ${{ github.event.inputs.allstars }}
          ALLSTARS_U23: ${{ github.event.inputs.allstars_u23 }}
          LIST_UNUSED_CANDIDATES: ${{ github.event.inputs.list_unused_candidates }}
          MATCH_WINDOW_DAYS: '7'
          PYTHONUNBUFFERED: "1"
        run: python generatore_formazioni/build_formazione_globale.py
      - if: always()
        run: |
          git config user.name "generatore-formazioni-bot"
          git config user.email "generatore-formazioni-bot@users.noreply.github.com"
          git add generatore_formazioni/output/*.html || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Formazione giornata: formazioni generate"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then exit 1; fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
      - name: Notifica Telegram con link al report HTML
        if: always()
        env:
          # Stesso canale Telegram gia' usato da bot_profit/manager_bundle_scan
          # (secrets.BUNDLE_TELEGRAM_TOKEN/_CHAT_ID -> env TELEGRAM_TOKEN/TELEGRAM_CHAT_ID).
          TELEGRAM_TOKEN: ${{ secrets.BUNDLE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BUNDLE_TELEGRAM_CHAT_ID }}
        run: python generatore_formazioni/formazione_telegram_notify.py
