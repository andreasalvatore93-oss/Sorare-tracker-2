      MATRICE_1: ${{ needs.discovery_gk_1.outputs.matrice }}
      MATRICE_2: ${{ needs.discovery_gk_2.outputs.matrice }}
      MATRICE_3: ${{ needs.discovery_gk_3_0.outputs.matrice }}
      MATRICE_4: ${{ needs.discovery_gk_3_1.outputs.matrice }}
      MATRICE_5: ${{ needs.discovery_gk_4_0.outputs.matrice }}
      MATRICE_6: ${{ needs.discovery_gk_4_1.outputs.matrice }}
      MATRICE_7: ${{ needs.discovery_def_0.outputs.matrice }}
      MATRICE_8: ${{ needs.discovery_def_1.outputs.matrice }}
