name: Formazione giornata

# Pipeline veloce, basata sulla GIORNATA invece che sui campionati.
#  1) discovery_fixture.py: dalle partite della fixture ricava le squadre in
#     campo, tiene solo le carte possedute di quelle squadre e applica la soglia
#     starter-odds. ~3 minuti invece di ~30, e produce la matrice lega/ruolo.
#  2) predict SOLO per i giocatori sopravvissuti (matrice dinamica: i campionati
#     senza nessun titolare probabile non generano alcun job).
#  3) consigli per lega/ruolo, nello stesso job del predict.
#  4) generatore formazioni.

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: 'Numero giornata Sorare (es. 95)'
        required: false
        default: ''
      fixture_slug:
        description: 'Slug fixture (es. football-28-31-jul-2026). Ha la precedenza.'
        required: false
        default: ''
      starter_odds_min:
        description: 'Soglia starter-odds (0-1). Odds assenti = escluso.'
        required: false
        default: '0.80'
      in_season:
        description: 'In Season per lega, priorita 1 (es. mls:6,kleague:6). Vuoto = nessuna.'
        required: false
        default: ''
      arene:
        description: 'Quante arene, priorita 2. Il bot sceglie tipo e numero per resa in essenze. 0 = nessuna.'
        required: false
        default: '0'
      essenze_arena:
        description: 'Essenze da investire in arena (priorita 2, in ALTERNATIVA o insieme ad "arene"): il bot genera arene efficienti finche il costo cumulato d.ingresso non supera questo budget. Vuoto (default) = nessun limite, si ricade sul solo numero richiesto in "arene".'
        required: false
        default: ''
      allstars:
        description: 'Numero di All Stars da 7, priorita 3. 0 = nessuna.'
        required: false
        default: '0'
      allstars_u23:
        description: 'Numero di All Stars Under 23 da 7, priorita 4. 0 = nessuna.'
        required: false
        default: '0'
      champions:
        description: 'Numero di Champions da 7 (competizione nuova, apre GW5), priorita 5 -- ultima, dopo le All Stars. Regole identiche alle All Stars, pool ristretto ai 5 top campionati (Premier League, Bundesliga, LaLiga, Ligue 1, Serie A). 0 = nessuna.'
        required: false
        default: '0'
      arena_leghe_abilitate:
        description: 'Arene dedicate per lega (es. mls,kleague o "tutte"). Vuoto = disattivate (default): solo Arena All Stars.'
        required: false
        default: ''
      escludi_lockate:
        description: 'Escludi le carte schierate in formazioni BLOCCATE (non modificabili) di questa giornata. Le formazioni ancora modificabili non contano. 0=no, 1=si (default)'
        required: false
        default: '1'
      extend_odds_060_070:
        description: 'Pool suppletivo Arena Beginner/All Stars/Under23 con odds 0.60-0.70 se la tornata a 0.80+ non riempie il richiesto. Default acceso (1), 0 per disattivarlo.'
        required: false
        default: '1'
      gk_att_avv:
        description: 'Correttivo GK da forza attacco storica avversario, formula "secca" (media storica tutta la carriera, refresh automatico). Default ACCESO (1) da 11/08/2026: su 360 GW-manager G migliora se stesso di +5.556 essenze, IC95% [+649;+10.638], 98,7% positivo -- vedi RISPOSTA_OPUS_CORRELAZIONI_2026-08-13.txt §13-14. Ri-misura pre-registrata dopo 3 fixture: HANDOFF_UNIFICATO_MODELLO_SCOUTING.md §5.6.'
        required: false
        default: '1'
      grade_group_storica:
        description: 'NON ACCENDERE prima del 25/08/2026 (test fuori campione pre-registrato non ancora fatto). Correttivo voto A-F con tabelle storiche di produzione (non il gruppetto lega/ruolo della singola giornata, spento per il 51%+ delle righe). Opus (12/08/2026): "pronta per il fuori campione pre-registrato, NON per la produzione diretta" -- placebo passato (p<=0,048, il voto ha segnale vero) ma la taglia (+10.102 essenze sul backtest) e la migliore di ~12 varianti sullo stesso campione, sovrastimata. Vedi HANDOFF_UNIFICATO_MODELLO_SCOUTING.md §8bis-bis e analisi_manager/p57_grade_fuoricampo_preregistrato.py (da lanciare dopo che GW7 chiude, PRIMA di decidere se accendere qui). Default SPENTO (0).'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  # GRADE (07/08/2026): UNA sola fetch per run, condivisa agli shard come
  # artifact. Prima ognuno dei 20 shard la rifaceva per conto suo: 3
  # leaderboard x 4 ruoli x fino a 20 pagine = ~240 richieste per shard,
  # ~4.800 a run. Misurato sulla run 31190547919: 4-8 risposte 429 per job, e
  # uno shard fermo a 200 slug con grade invece di 877 per paginazione
  # troncata dai 429. Cosi' le richieste sono ~240 in tutto.
  # NB: gira su runner GitHub normali. Il problema che sembrava di rete (0
  # nodi solo da GitHub) era la sessione resa anonima dalle query senza CSRF,
  # gia' corretta: nessun runner self-hosted serve.
  pool:
    name: pool (odds + grade, una volta per tutta la run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # cache pip come tutti gli altri job (12/08/2026): questo era
          # rimasto senza e rifaceva il download dei pacchetti a ogni run,
          # ~10s di wall sul percorso critico, che e' il job che apre la run.
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install requests curl_cffi
      - name: Raccolta grade
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_VERSION: ${{ secrets.SORARE_VERSION }}
          SORARE_BUILD: ${{ secrets.SORARE_BUILD }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          ESCLUDI_LOCKATE: ${{ github.event.inputs.escludi_lockate }}
          GAMEWEEK: ${{ github.event.inputs.gameweek }}
          FIXTURE_SLUG: ${{ github.event.inputs.fixture_slug }}
          PYTHONUNBUFFERED: "1"
        run: python fetch_grade_gw.py
      - uses: actions/upload-artifact@v4
        with:
          name: pool_gw
          path: pool_gw.json
          retention-days: 1

  # 4 JOB, UNO PER RUOLO (07/08/2026). Prima erano 20, e la ragione erano le
  # odds: si interrogava un giocatore alla volta, quindi conveniva spezzare il
  # lavoro. Da quando le odds arrivano in bulk dal job 'pool' quel costo non
  # esiste piu', e i 20 shard erano rimasti a fare danno: ognuno RI-PAGINAVA
  # tutte le carte del suo ruolo (DEF diviso in 9 shard = le stesse 561 carte
  # scaricate 9 volte). Misurato sulla run 31194330176: 1705 risposte 429,
  # tutte dalla paginazione carte, con attese da 289s -- discovery 7.7 min.
  # Ora ogni ruolo pagina le sue carte UNA volta e chiede la L10 solo ai
  # sopravvissuti: 308 in tutto, il ruolo piu' carico (DEF) ne ha 113.
  # Lo shard vuoto ('def,,') significa nessun filtro lega: il job prende tutte
  # le leghe del ruolo, comprese mls/kleague.
  discovery:
    name: discovery ${{ matrix.gruppo.nome }}
    needs: pool
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gruppo:
          - { nome: "gk",  cfg: "gk,," }
          - { nome: "def", cfg: "def,," }
          - { nome: "mid", cfg: "mid,," }
          - { nome: "fwd", cfg: "fwd,," }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install requests curl_cffi
      # Il grade arriva dal job 'grade' di questa stessa run: qui nessuno shard
      # rifa' la fetch (era la causa dei 429, vedi commento sul job 'grade').
      - uses: actions/download-artifact@v4
        with: { name: pool_gw }
      - name: Discovery
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_VERSION: ${{ secrets.SORARE_VERSION }}
          SORARE_BUILD: ${{ secrets.SORARE_BUILD }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          ESCLUDI_LOCKATE: ${{ github.event.inputs.escludi_lockate }}
          GAMEWEEK: ${{ github.event.inputs.gameweek }}
          FIXTURE_SLUG: ${{ github.event.inputs.fixture_slug }}
          ARENE_EFFICIENTI: ${{ github.event.inputs.arene }}
          ESSENZE_ARENA: ${{ github.event.inputs.essenze_arena }}
          MIN_STARTER_ODDS: ${{ github.event.inputs.starter_odds_min }}
          EXTEND_ODDS_060_070: ${{ github.event.inputs.extend_odds_060_070 }}
          CFG: ${{ matrix.gruppo.cfg }}
          IDX: ${{ strategy.job-index }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          set -o pipefail
          # STAGGER TOLTO (12/08/2026). Era stato messo qualche ora prima (P6)
          # sull'ipotesi che i 429 nascessero dalla simultaneita'. Quell'ipotesi
          # e' stata poi FALSIFICATA nella fase predict: alzando il pacing da
          # 0,2s a 1,0s per runner i 429 non sono diminuiti (27 contro 20) pur
          # avendo un terzo delle query. La causa vera del 429 in discovery era
          # un'altra e gia' corretta a monte (P5: ogni job rifaceva le 216 query
          # odds che il job 'pool' aveva gia' fatto). Lo stagger costava fino a
          # 75 secondi di wall sull'ultimo shard a ogni run, per niente.
          # Se i 429 in discovery dovessero tornare, si rimette -- ma dopo
          # averli visti nei log, non per precauzione.
          # La matrice lega/ruolo di ogni shard viene raccolta da stdout e
          # scritta in _artifact_stage/_matrici/: NON puo' piu' passare dagli
          # output di job (un job che esegue piu' shard scriverebbe piu' volte
          # lo stesso output e vincerebbe solo l'ultimo). La legge
          # discovery_merge dopo aver scaricato gli artifact.
          mkdir -p _artifact_stage/_matrici
          printf '%s\n' "$CFG" | tr '|' '\n' > cfg.txt
          echo "Shard di questo gruppo:"; cat cfg.txt
          ko=0
          i=0
          while IFS=, read -r RUOLI SHARD HEAVY <&3; do
            [ -n "$RUOLI" ] || continue
            i=$((i + 1))
            echo "=== discovery ruoli=$RUOLI shard=$SHARD heavy=${HEAVY:-nessuno}"
            if DISCOVERY_ROLES="$RUOLI" DISCOVERY_LEAGUE_SHARD="$SHARD" \
               HEAVY_LEAGUE_SHARD="$HEAVY" \
               python discovery_fixture.py 2>&1 | tee out.txt; then
              :
            else
              ko=1
              echo "ATTENZIONE: shard $RUOLI/$SHARD/${HEAVY:-} FALLITO"
            fi
            grep -o 'MATRICE_JSON=.*' out.txt | tail -1 \
              | sed 's/^MATRICE_JSON=//' > "_artifact_stage/_matrici/${IDX}_${i}.json" || true
          done 3< cfg.txt
          # Se almeno uno shard e' fallito il job fallisce, come faceva prima
          # il job singolo -- ma solo DOPO aver eseguito tutti gli altri, e gli
          # step di stage/upload sotto girano comunque (if: always()).
          exit $ko
      - if: always()
        run: python pipeline_artifacts.py stage _artifact_stage '^formazione_[^/]+/output/[^/]+_discovery/'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disc-${{ strategy.job-index }}
          path: _artifact_stage
          # SENZA QUESTA RIGA LE CACHE NON TORNANO MAI SU MAIN (12/08/2026,
          # spreco REALE misurato). actions/upload-artifact@v4 esclude di
          # default tutto cio' che comincia per '.', e le due cache condivise
          # vivono in cartelle nascoste: <lega>_<ruolo>_all/.game_log_cache
          # (game log) e /.cache (dettaglio granulare). Misurato sulla run
          # 31591410268, shard predict 36: 'stage' ne aveva preparati 62,
          # 'With the provided path, there will be 29 files uploaded' -- i 33
          # mancanti erano tutti file di cache. Conseguenza: ogni run
          # ri-scaricava da Sorare partite gia' scaricate nella run
          # precedente, per sempre, e nessuno poteva accorgersene perche' i
          # file c'erano (vecchi) e il job finiva verde.
          include-hidden-files: true
          retention-days: 1

  discovery_merge:
    needs: [discovery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrice: ${{ steps.merge.outputs.matrice }}
      matrice_unique: ${{ steps.merge.outputs.matrice_unique }}
      gruppi_predict: ${{ steps.merge.outputs.gruppi_predict }}
    steps:
      # Raccoglie gli artifact dei 36 job discovery e li unisce in un solo
      # artifact 'discovery-merged' che i job a valle scaricano (prima ogni
      # job discovery pushava su main: 1123 job-secondi di sola contesa sul
      # retry-loop, vedi pipeline_artifacts.py). L'unione dei sotto-shard
      # della stessa lega pesante usa la stessa semantica di
      # merge_discovery_json.py (lista -> unione, dict -> update).
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: disc-*
      - id: merge
        run: |
          python3 pipeline_artifacts.py apply _artifacts
          python3 pipeline_artifacts.py stage _artifact_stage '^formazione_[^/]+/output/[^/]+_discovery/'
          python3 pipeline_artifacts.py matrice >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-merged
          path: _artifact_stage
          # SENZA QUESTA RIGA LE CACHE NON TORNANO MAI SU MAIN (12/08/2026,
          # spreco REALE misurato). actions/upload-artifact@v4 esclude di
          # default tutto cio' che comincia per '.', e le due cache condivise
          # vivono in cartelle nascoste: <lega>_<ruolo>_all/.game_log_cache
          # (game log) e /.cache (dettaglio granulare). Misurato sulla run
          # 31591410268, shard predict 36: 'stage' ne aveva preparati 62,
          # 'With the provided path, there will be 29 files uploaded' -- i 33
          # mancanti erano tutti file di cache. Conseguenza: ogni run
          # ri-scaricava da Sorare partite gia' scaricate nella run
          # precedente, per sempre, e nessuno poteva accorgersene perche' i
          # file c'erano (vecchi) e il job finiva verde.
          include-hidden-files: true
          retention-days: 1

  predict:
    needs: discovery_merge
    if: needs.discovery_merge.outputs.matrice != '' && needs.discovery_merge.outputs.matrice != '[]'
    name: predict ${{ matrix.gruppo.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # 20 = tetto REALE di job concorrenti dell'account (verificato: la
      # concorrenza massima osservata e' 20 esatti su ogni run, il vecchio
      # max-parallel: 77 era inerte). Le combinazioni lega/ruolo/shard sono
      # raggruppate da pipeline_artifacts.py in <= 20 bin bilanciati per
      # carico stimato, quindi ogni slot di concorrenza paga UNA volta i ~19s
      # di checkout+setup+pip invece di una volta per combinazione (prima: 60
      # job predict = 1085 job-secondi di solo overhead) e la fase non resta
      # appesa al job piu' sfortunato (run 30484170456: scozia/fwd da 398s
      # mentre gli altri finivano in 40s). Gli slug processati da ogni shard
      # sono INVARIATI: stesso split i % n == idx, vedi 'slugs' in
      # pipeline_artifacts.py.
      max-parallel: 20
      matrix:
        gruppo: ${{ fromJson(needs.discovery_merge.outputs.gruppi_predict) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install requests curl_cffi
      # name: (non pattern:) di proposito -- se l'artifact della discovery
      # manca, il job DEVE fallire invece di proseguire sui player_slugs.json
      # vecchi rimasti nel checkout, generando predizioni per i giocatori
      # della giornata precedente senza nessun errore visibile.
      - uses: actions/download-artifact@v4
        with:
          name: discovery-merged
          path: _artifacts/discovery-merged
      - run: python pipeline_artifacts.py apply _artifacts
      - name: Predict
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          # TRE CHIAVI, UNA PER SHARD (12/08/2026). Ogni APIKEY Sorare vale
          # 200 richieste/minuto e i tetti sono INDIPENDENTI: tre chiavi fanno
          # i 600/min che la documentazione indica come massimo del programma
          # (github.com/sorare/api). Lo shard sceglie la sua in base al numero
          # di job, cosi' il traffico si divide in tre secchielli separati
          # invece di svuotarne uno solo.
          # Il codice Python non cambia: continua a leggere SORARE_APIKEY, e'
          # lo shell dello step che gliela assegna.
          SORARE_APIKEY_A: ${{ secrets.SORARE_APIKEY }}
          SORARE_APIKEY_B: ${{ secrets.SORARE_APIKEY_2 }}
          SORARE_APIKEY_C: ${{ secrets.SORARE_APIKEY_3 }}
          IDX_CHIAVE: ${{ strategy.job-index }}
          SORARE_CSRF: ${{ secrets.SORARE_CSRF }}
          SORARE_VERSION: ${{ secrets.SORARE_VERSION }}
          SORARE_BUILD: ${{ secrets.SORARE_BUILD }}
          SORARE_DEVICE_FINGERPRINT: ${{ secrets.SORARE_DEVICE_FINGERPRINT }}
          ESCLUDI_LOCKATE: ${{ github.event.inputs.escludi_lockate }}
          GRUPPO: ${{ matrix.gruppo.g }}
          # PACING SPENTO (12/08/2026, terzo e ultimo tempo di questa storia).
          # Cronologia, perche' non la si rifaccia da capo:
          #   run 31615179175  1 chiave, nessun freno -> 19 blocchi, 2352s persi
          #   run 31617233911  1 chiave, freno 2,0s   -> 20 blocchi, 1174s persi
          #                                              ma predict 265s -> 400s
          #   run 31618793265  3 chiavi, freno 2,0s   ->  0 blocchi,    0s persi
          #                                              predict 318s
          # Col freno acceso si aspettano ~150 secondi di attesa VOLUTA (1492
          # richieste x 2s / 20 job), mentre i 19 blocchi della run senza freno
          # ne costavano ~118: si pagava piu' del danno che si evitava. Il freno
          # serviva quando il budget era 200/min con una chiave sola; con tre
          # chiavi (600/min) il ritmo naturale ci sta dentro da solo.
          # Se i 429 dovessero tornare si riaccende rimettendo qui
          # SORARE_PACING_MIN: il meccanismo resta, e' solo spento.
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          # Assegna a questo shard una delle tre chiavi (vedi commento sopra).
          # Se le chiavi 2 e 3 non fossero nei secret si ricade sulla prima:
          # la pipeline continua a funzionare esattamente come prima.
          case $(( IDX_CHIAVE % 3 )) in
            0) export SORARE_APIKEY="$SORARE_APIKEY_A" ;;
            1) export SORARE_APIKEY="${SORARE_APIKEY_B:-$SORARE_APIKEY_A}" ;;
            2) export SORARE_APIKEY="${SORARE_APIKEY_C:-$SORARE_APIKEY_A}" ;;
          esac
          echo "shard $IDX_CHIAVE -> chiave $(( IDX_CHIAVE % 3 + 1 )) di 3 (valore non stampato)"
          python pipeline_artifacts.py combos "$GRUPPO" > combos.tsv
          echo "Combinazioni di questo gruppo:"; cat combos.tsv
          while IFS=$'\t' read -r LEGA RUOLO SHARD <&3; do
            [ -n "$LEGA" ] || continue
            case "$RUOLO" in
              gk)  PY=test_gk.py ;;
              def) PY=test_def.py ;;
              mid) PY=test_mid.py ;;
              fwd) PY=test_mls_fwd_all.py ;;
            esac
            SLUGS=$(python pipeline_artifacts.py slugs "$LEGA" "$RUOLO" "$SHARD")
            echo "=== $LEGA/$RUOLO (shard '${SHARD:-nessuno}'): $SLUGS"
            for SLUG in $SLUGS; do
              echo "--- $LEGA/$RUOLO: $SLUG ---"
              T0=$(date +%s)
              TARGET_SLUG="$SLUG" python "formazione_$LEGA/predict/$PY" || echo "predict fallito per $SLUG"
              printf '%s\t%s\t%s\n' "$LEGA" "$RUOLO" "$(( $(date +%s) - T0 ))" >> misure_costi.tsv
            done
          done 3< combos.tsv
      # Esclude le cartelle _discovery: sono gia' nell'artifact
      # discovery-merged e verrebbero rimesse in ogni artifact di
      # questa fase (identiche, quindi innocue, ma inutili).
      - if: always()
        run: |
          python pipeline_artifacts.py stage _artifact_stage '^formazione_[^/]+/output/(?![^/]+_discovery/)'
          # Misure di questo gruppo: alimentano pipeline_costi.json, da cui la
          # run successiva ricava lo sharding. Vanno scritte DOPO 'stage'
          # (che copia solo i file visti da git) e viaggiano nello stesso
          # artifact.
          python pipeline_artifacts.py costi misure_costi.tsv _artifact_stage "${{ strategy.job-index }}" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pred-${{ strategy.job-index }}
          path: _artifact_stage
          # SENZA QUESTA RIGA LE CACHE NON TORNANO MAI SU MAIN (12/08/2026,
          # spreco REALE misurato). actions/upload-artifact@v4 esclude di
          # default tutto cio' che comincia per '.', e le due cache condivise
          # vivono in cartelle nascoste: <lega>_<ruolo>_all/.game_log_cache
          # (game log) e /.cache (dettaglio granulare). Misurato sulla run
          # 31591410268, shard predict 36: 'stage' ne aveva preparati 62,
          # 'With the provided path, there will be 29 files uploaded' -- i 33
          # mancanti erano tutti file di cache. Conseguenza: ogni run
          # ri-scaricava da Sorare partite gia' scaricate nella run
          # precedente, per sempre, e nessuno poteva accorgersene perche' i
          # file c'erano (vecchi) e il job finiva verde.
          include-hidden-files: true
          retention-days: 1

  # Aggregazione consiglio: legge TUTTI i file prediction_<slug>_*.txt di una
  # coppia lega/ruolo, quindi va costruita UNA volta sola dopo che tutti i
  # gruppi predict sono completati -- da qui 'needs: predict' a livello di job
  # intero. Usa matrice_unique (una voce per coppia lega/ruolo, senza shard).
  #
  # 29/07: da 58 job a matrice a UN job unico. Misurato sulla run
  # 30484170456: i 58 job costavano 4020 job-secondi (268s di wall) di cui
  # 2934 di git push e 906 di checkout, per un lavoro reale di 0 secondi
  # ("Costruisci consiglio" = 0s su tutti e 58). Lo script di consiglio non
  # fa nessuna chiamata di rete: eseguirli in sequenza in un solo job costa
  # meno di un secondo a coppia.
  consiglio:
    needs: [discovery_merge, predict]
    if: needs.discovery_merge.outputs.matrice != '' && needs.discovery_merge.outputs.matrice != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - uses: actions/download-artifact@v4
        with:
          name: discovery-merged
          path: _artifacts/discovery-merged
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: pred-*
      - run: python pipeline_artifacts.py apply _artifacts
      - name: Costruisci consigli
        env:
          MATRICE_UNIQUE: ${{ needs.discovery_merge.outputs.matrice_unique }}
        run: |
          set -u
          python pipeline_artifacts.py coppie > coppie.tsv
          echo "Coppie lega/ruolo:"; cat coppie.tsv
          while IFS=$'\t' read -r LEGA RUOLO <&3; do
            [ -n "$LEGA" ] || continue
            case "$RUOLO" in
              gk)  CO=build_consiglio_gk.py ;;
              def) CO=build_consiglio_def.py ;;
              mid) CO=build_consiglio_mid.py ;;
              fwd) CO=build_consiglio.py ;;
            esac
            echo "=== consiglio $LEGA/$RUOLO"
            python "formazione_$LEGA/consiglio/$CO" || echo "consiglio non generato per $LEGA/$RUOLO"
          done 3< coppie.tsv
      # Esclude le cartelle _discovery: sono gia' nell'artifact
      # discovery-merged e verrebbero rimesse in ogni artifact di
      # questa fase (identiche, quindi innocue, ma inutili).
      - if: always()
        run: python pipeline_artifacts.py stage _artifact_stage '^formazione_[^/]+/output/(?![^/]+_discovery/)'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cons-0
          path: _artifact_stage
          # SENZA QUESTA RIGA LE CACHE NON TORNANO MAI SU MAIN (12/08/2026,
          # spreco REALE misurato). actions/upload-artifact@v4 esclude di
          # default tutto cio' che comincia per '.', e le due cache condivise
          # vivono in cartelle nascoste: <lega>_<ruolo>_all/.game_log_cache
          # (game log) e /.cache (dettaglio granulare). Misurato sulla run
          # 31591410268, shard predict 36: 'stage' ne aveva preparati 62,
          # 'With the provided path, there will be 29 files uploaded' -- i 33
          # mancanti erano tutti file di cache. Conseguenza: ogni run
          # ri-scaricava da Sorare partite gia' scaricate nella run
          # precedente, per sempre, e nessuno poteva accorgersene perche' i
          # file c'erano (vecchi) e il job finiva verde.
          include-hidden-files: true
          retention-days: 1

  # Commit unico di tutti gli output della run (discovery + predict +
  # consiglio). Prima ogni singolo job pushava per conto suo con un
  # retry-loop: 6488 job-secondi su 14234 totali (46% della compute) spesi in
  # contesa su main, perche' con 20 job che pushano insieme ogni giro di
  # retry ne fa passare UNO solo. Lo stato finale di main e' lo stesso.
  # 'always()' di proposito: se predict o consiglio falliscono a meta', gli
  # output parziali devono comunque essere committati -- era la proprieta'
  # della versione a push-per-job e va conservata.
  salva_output:
    needs: [discovery_merge, predict, consiglio]
    if: always() && needs.discovery_merge.outputs.matrice != '' && needs.discovery_merge.outputs.matrice != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      # pattern: (non name:) perche' questo job gira anche quando una fase a
      # monte e' fallita e il suo artifact puo' mancare del tutto.
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: discovery-merged
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: pred-*
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: cons-*
      - run: python pipeline_artifacts.py apply _artifacts
      # Modello di costo per il bilanciamento dei gruppi predict della run
      # successiva (nessun effetto sullo scoring, vedi pipeline_artifacts.py).
      - run: python pipeline_artifacts.py aggrega_costi || true
      - run: |
          git config user.name "generatore-formazioni-bot"
          git config user.email "generatore-formazioni-bot@users.noreply.github.com"
          git add formazione_*/output/ pipeline_costi.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Formazione giornata: output run (discovery + predict + consiglio)"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then exit 1; fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
            python merge_discovery_json.py
            git add formazione_*/output/ || true
            git commit --amend --no-edit || true
          done

  formazione:
    needs: [discovery_merge, predict, consiglio]
    # if: always() (28/07, bug reale) girava ANCHE quando la giornata non si
    # risolveva affatto (es. gameweek/fixture_slug mancanti o sbagliati):
    # tutti i job discovery fallivano, predict veniva giustamente saltato
    # (guardia sotto), ma questo job proseguiva comunque leggendo i CONSIGLI
    # VECCHI gia' committati da run precedenti -- generava e notificava su
    # Telegram una formazione "nuova" ma basata su dati stantii, senza alcun
    # errore visibile. Stessa guardia di 'predict': gira solo se la discovery
    # ha prodotto almeno una combinazione lega/ruolo, altrimenti salta tutto
    # (formazione E notifica) invece di proseguire silenziosamente sul vecchio.
    if: needs.discovery_merge.outputs.matrice != '' && needs.discovery_merge.outputs.matrice != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-formazione.txt
      - run: pip install requests curl_cffi
      # Stessa ragione di 'predict': se gli artifact mancano il job deve
      # fallire, non generare una formazione sui consigli della giornata
      # precedente rimasti nel checkout.
      - uses: actions/download-artifact@v4
        with:
          name: discovery-merged
          path: _artifacts/discovery-merged
      - uses: actions/download-artifact@v4
        with:
          name: cons-0
          path: _artifacts/cons-0
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: pred-*
      - run: python pipeline_artifacts.py apply _artifacts
      # GK_ATT_AVV (11/08/2026): refresh INCREMENTALE della tabella
      # attacco-avversario (solo partite nuove, query pubbliche, no cookie).
      # Gira SEMPRE (anche a gk_att_avv=0) cosi' la tabella resta aggiornata
      # per quando la si accende. ATTENZIONE COSTO: il checkout e' shallow e
      # non porta analisi_manager/dati/_cache_index_gamelog.json (20MB, mai
      # committato di proposito): la prima volta che gira in un checkout
      # fresco si ricostruisce da zero dai *_gamelog.json tracciati (~2 min).
      # BUG REALE trovato in run 31520960100 (11/08/2026): questo commento
      # dichiarava il rebuild automatico, ma p42_estrai_gol_tutte_squadre_
      # archivio.squadre_archivio() leggeva il file con json.load diretto,
      # SENZA MAI chiamare la funzione che lo ricostruisce -- FileNotFoundError
      # certo su ogni checkout fresco, run intera fallita. Fix: ora chiama
      # costruisci_indice_cache() (gia' in produzione altrove), verificato
      # in locale simulando il checkout fresco (file assente -> ricostruito
      # in 80s, stesse 4828 chiavi del file precedente). Vuol dire comunque
      # ~1-2 min in piu' ad OGNI run finche' non si persiste l'indice fra run
      # (cache actions/cache o commit) -- da valutare se il costo infastidisce.
      - run: python generatore_formazioni/dati/aggiorna_gk_attacco_avversario.py
      # GRADE_GROUP_STORICA (12/08/2026, SPENTO di default -- vedi input
      # grade_group_storica sopra): refresh delle due tabelle (voto +
      # sd_atteso) dai consiglio_*.txt di QUESTA run. Gira SEMPRE (anche a
      # flag spento) cosi' le tabelle non sono stantie per quando si decide
      # di accendere, zero query di rete.
      - run: python generatore_formazioni/dati/aggiorna_grade_scala_produzione.py
      - id: genera
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          SORARE_APIKEY: ${{ secrets.SORARE_APIKEY }}
          GK_ATT_AVV_ENABLED: ${{ github.event.inputs.gk_att_avv }}
          GRADE_GROUP_STORICA_ENABLED: ${{ github.event.inputs.grade_group_storica }}
          # NUOVO (31/07, fix bug reale kyriani-sabbe): servono per risolvere
          # ESATTAMENTE la stessa giornata gia' usata da discovery_fixture.py
          # (vedi _risolvi_finestra_esplicita in build_formazione_globale.py)
          # invece di un giorno-count approssimato -- se sono impostati, la
          # finestra e' quella e basta, nessuna tolleranza.
          GAMEWEEK: ${{ github.event.inputs.gameweek }}
          FIXTURE_SLUG: ${{ github.event.inputs.fixture_slug }}
          ARENE_EFFICIENTI: ${{ github.event.inputs.arene }}
          ESSENZE_ARENA: ${{ github.event.inputs.essenze_arena }}
          IN_SEASON: ${{ github.event.inputs.in_season }}
          ALLSTARS: ${{ github.event.inputs.allstars }}
          ALLSTARS_U23: ${{ github.event.inputs.allstars_u23 }}
          CHAMPIONS: ${{ github.event.inputs.champions }}
          ARENA_LEAGUES_ENABLED: ${{ github.event.inputs.arena_leghe_abilitate }}
          # Hardcoded (10/08, tolti dagli input per non confondere in fase di
          # lancio): LIST_UNUSED_CANDIDATES e' solo log, zero costo, sempre
          # acceso; ARENA_CRITERIO resta sul comportamento di sempre
          # (assoluto), la misura 'capitale' non e' stata scelta per la
          # produzione.
          LIST_UNUSED_CANDIDATES: '1'
          ARENA_CRITERIO: 'assoluto'
          EXTEND_ODDS_060_070: ${{ github.event.inputs.extend_odds_060_070 }}
          PYTHONUNBUFFERED: "1"
        run: python generatore_formazioni/build_formazione_globale.py
      - if: always()
        run: |
          git config user.name "generatore-formazioni-bot"
          git config user.email "generatore-formazioni-bot@users.noreply.github.com"
          git add generatore_formazioni/output/*.html || true
          # GK_ATT_AVV: persiste l'aggiornamento incrementale (partite nuove
          # + tabella ricalcolata) cosi' il prossimo run riparte da qui,
          # senza rifare il lavoro. Se lo script non ha trovato niente di
          # nuovo questi add sono no-op (git diff --cached vuoto).
          git add analisi_manager/dati/gol_squadre_archivio_2025-26_*.json \
                  generatore_formazioni/dati/gk_attacco_avversario.json || true
          # I file applicati dagli artifact li committa salva_output: qui
          # restano come modifiche non committate e bloccherebbero il
          # 'git merge' del retry-loop sotto (bug reale run 30496069817:
          # HTML mai arrivato su main, link Telegram rotto).
          git stash push --include-untracked --keep-index --quiet || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Formazione giornata: formazioni generate"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then exit 1; fi
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
            git add generatore_formazioni/output/*.html || true
            git commit --amend --no-edit || true
          done
      - name: Notifica Telegram con link al report HTML
        # steps.genera.outcome == 'success' (12/08/2026, bug reale): prima
        # partiva SEMPRE (always()), anche se build_formazione_globale.py
        # crashava -- notificava un report vecchio come se fosse quello
        # appena generato (vedi anche _report_di_questa_run in
        # formazione_telegram_notify.py, il secondo livello dello stesso fix).
        if: always() && steps.genera.outcome == 'success'
        env:
          # Stesso canale Telegram gia' usato da bot_profit/manager_bundle_scan
          # (secrets.BUNDLE_TELEGRAM_TOKEN/_CHAT_ID -> env TELEGRAM_TOKEN/TELEGRAM_CHAT_ID).
          TELEGRAM_TOKEN: ${{ secrets.BUNDLE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BUNDLE_TELEGRAM_CHAT_ID }}
        run: python generatore_formazioni/formazione_telegram_notify.py
