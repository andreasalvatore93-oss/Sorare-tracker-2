name: Calibrazione lega (generico, riusabile)

# Workflow UNICO e PARAMETRIZZATO (29/07) che sostituisce il vecchio pattern
# "un grid_search_calibrazione_<lega>.yml per ogni campionato" (rimosso nelle
# pulizie precedenti, sez. 26/34 del RIASSUNTO) -- stessa logica, ma con
# `lega` come input invece di un file duplicato per campionato: non va
# ricostruito da zero ogni volta che serve calibrare una nuova lega.
#
# Per un ruolo scelto, lancia un job a matrice che rilancia
# test_<ruolo>.py in CALIBRATION_MODE per ogni giocatore del batch, salvando
# i risultati in formazione_<lega>/output/<lega>_<ruolo>_calibration/grid_search/.
#
# Pool giocatori (in ordine di preferenza, nessun input da scegliere a mano):
#   1. formazione_<lega>/output/<lega>_<ruolo>_discovery_global/player_slugs.json
#      se esiste (discovery globale gia' fatta con uno script <lega>_<ruolo>_
#      discovery_global.py + workflow dedicato, es. run_germania_discovery_global.yml)
#   2. altrimenti lancia la discovery POSSEDUTI standard
#      (formazione_<lega>/discovery/<lega>_<ruolo>_discovery.py) e usa quella
#
# GitHub Actions ha un limite di 256 job per matrice; per pool piu' ampi usare
# batch_index (i risultati si ACCUMULANO in grid_search/, ogni batch esclude
# chi ha gia' un grid.json salvato da un giro precedente).
#
# Aggregazione (locale, non serve CI):
#   RUOLO=<ruolo> CAMPIONATO=<lega> python formazione_mls/calibrazione/aggregate_grid_search.py

on:
  workflow_dispatch:
    inputs:
      lega:
        description: 'Nome cartella lega (es. germania, spagna, francia -- vedi formazione_<lega>/)'
        required: true
        type: string
      ruolo:
        description: 'Ruolo da calibrare'
        required: true
        type: choice
        options: [gk, def, mid, fwd]
      batch_index:
        description: 'Indice del batch (0-based). Ogni batch copre batch_size giocatori.'
        required: false
        default: '0'
      batch_size:
        description: 'Giocatori per batch (max 256 per il limite GitHub Actions sulla matrice)'
        required: false
        default: '200'

permissions:
  contents: write

concurrency:
  # FIX (30/07): raggruppare per batch_index (non solo lega+ruolo) -- con un
  # solo gruppo condiviso, lanciare piu' batch in rapida successione ne
  # cancellava la maggior parte in coda (GitHub Actions tiene solo l'ultimo
  # run in coda per gruppo, anche con cancel-in-progress:false, che protegge
  # solo il run GIA' in esecuzione). Batch diversi processano giocatori
  # diversi, non c'e' motivo di serializzarli.
  group: calibrazione-lega-${{ github.event.inputs.lega }}-${{ github.event.inputs.ruolo }}-${{ github.event.inputs.batch_index }}
  cancel-in-progress: false

jobs:
  discover_batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      player_slugs: ${{ steps.slice.outputs.player_slugs }}
      batch_count: ${{ steps.slice.outputs.batch_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi

      - name: Discovery posseduti (SOLO se non esiste gia' una discovery globale)
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: |
          LEGA="${{ github.event.inputs.lega }}"
          RUOLO="${{ github.event.inputs.ruolo }}"
          GLOBAL_FILE="formazione_${LEGA}/output/${LEGA}_${RUOLO}_discovery_global/player_slugs.json"
          if [ -f "$GLOBAL_FILE" ]; then
            echo "Discovery globale gia' presente ($GLOBAL_FILE), salto la discovery posseduti."
            exit 0
          fi
          SCRIPT="formazione_${LEGA}/discovery/${LEGA}_${RUOLO}_discovery.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "ERRORE: nessuna discovery globale ne' posseduti trovata per lega=$LEGA ruolo=$RUOLO ($SCRIPT mancante)."
            exit 1
          fi
          python "$SCRIPT"

      - name: Commit output discovery aggiornato (solo se posseduti)
        run: |
          git config user.name "calibrazione-lega-bot"
          git config user.email "calibrazione-lega-bot@users.noreply.github.com"
          LEGA="${{ github.event.inputs.lega }}"
          RUOLO="${{ github.event.inputs.ruolo }}"
          git add "formazione_${LEGA}/output/${LEGA}_${RUOLO}_discovery/" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Calibrazione ${LEGA} (${RUOLO}): discovery posseduti aggiornata"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Estrai il batch richiesto (batch_index/batch_size, esclusi i gia' analizzati)
        id: slice
        run: |
          python3 - <<'EOF'
          import json, os

          lega = "${{ github.event.inputs.lega }}"
          ruolo = "${{ github.event.inputs.ruolo }}"
          batch_index = int("${{ github.event.inputs.batch_index || '0' }}")
          batch_size = int("${{ github.event.inputs.batch_size || '200' }}")

          global_path = f"formazione_{lega}/output/{lega}_{ruolo}_discovery_global/player_slugs.json"
          owned_path = f"formazione_{lega}/output/{lega}_{ruolo}_discovery/player_slugs.json"
          path = global_path if os.path.isfile(global_path) else owned_path
          print(f"Pool usato: {path}")
          with open(path, encoding="utf-8") as f:
              slugs = json.load(f)

          # ESCLUDE i giocatori che hanno gia' un grid.json salvato da un giro
          # di calibrazione precedente -- permette di rilanciare senza rifare
          # query API/job CI su chi e' gia' stato processato.
          grid_dir = f"formazione_{lega}/output/{lega}_{ruolo}_calibration/grid_search"
          already_done = set()
          if os.path.isdir(grid_dir):
              already_done = {
                  fname[:-len("_grid.json")]
                  for fname in os.listdir(grid_dir) if fname.endswith("_grid.json")
              }
          new_slugs = [s for s in slugs if s not in already_done]

          start = batch_index * batch_size
          end = start + batch_size
          batch = new_slugs[start:end]

          batch_count = (len(new_slugs) + batch_size - 1) // batch_size

          print(f"Totale giocatori qualificati: {len(slugs)}")
          print(f"Gia' analizzati in precedenza (esclusi da questo giro): {len(slugs) - len(new_slugs)}")
          print(f"Da analizzare: {len(new_slugs)}")
          print(f"Batch {batch_index} (range [{start}:{end}]): {len(batch)} giocatori")
          print(f"Batch totali necessari per coprire i rimanenti: {batch_count}")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"player_slugs={json.dumps(batch)}\n")
              f.write(f"batch_count={batch_count}\n")
          EOF

  calibrate:
    needs: discover_batch
    if: needs.discover_batch.outputs.player_slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        player_slug: ${{ fromJson(needs.discover_batch.outputs.player_slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi

      - name: Grid search completo per ${{ matrix.player_slug }}
        env:
          SORARE_COOKIE: ${{ secrets.SORARE_COOKIE }}
          TARGET_SLUG: ${{ matrix.player_slug }}
          CALIBRATION_MODE: "si"
          PYTHONUNBUFFERED: "1"
        run: |
          LEGA="${{ github.event.inputs.lega }}"
          RUOLO="${{ github.event.inputs.ruolo }}"
          if [ "$RUOLO" = "fwd" ]; then
            python "formazione_${LEGA}/predict/test_mls_fwd_all.py"
          else
            python "formazione_${LEGA}/predict/test_${RUOLO}.py"
          fi

      - name: Commit risultati grid search (accumulo, non sovrascrive altri batch)
        if: always()
        run: |
          git config user.name "calibrazione-lega-bot"
          git config user.email "calibrazione-lega-bot@users.noreply.github.com"
          LEGA="${{ github.event.inputs.lega }}"
          RUOLO="${{ github.event.inputs.ruolo }}"
          git add "formazione_${LEGA}/output/${LEGA}_${RUOLO}_calibration/"
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Calibrazione ${LEGA} (${RUOLO}): ${{ matrix.player_slug }}"
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 15 ]; then
              echo "Impossibile salvare dopo 15 tentativi, abbandono."
              exit 1
            fi
            echo "Push fallito, ritento tra qualche secondo... (tentativo $attempt)"
            sleep $((RANDOM % 12 + 5))
            git fetch origin main
            git merge --no-edit -X ours origin/main
          done
          echo "Salvato correttamente."
